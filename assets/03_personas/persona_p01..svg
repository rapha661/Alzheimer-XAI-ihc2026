<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .h1 { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .h2 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #ffffff; opacity: 0.9; }
      .label { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #1d4e6b; text-transform: uppercase; letter-spacing: 0.5px; }
      .body { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #2c3e46; }
      .quote { font: italic 600 16px 'Segoe UI', Arial, sans-serif; fill: #1d4e6b; }
      .tag { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .footer { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #ffffff; opacity: 0.85; }
    </style>
  </defs>

  <rect width="900" height="620" fill="#f4f8fa"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="140" fill="#1d4e6b"/>
  <circle cx="90" cy="70" r="46" fill="#ffffff" opacity="0.15"/>
  <circle cx="90" cy="58" r="18" fill="#ffffff"/>
  <path d="M55 105 Q90 68 125 105 L125 112 L55 112 Z" fill="#ffffff"/>

  <text x="160" y="55" class="h1">Dr. Marcos Andrade</text>
  <text x="160" y="80" class="h2">Médico Clínico — Atenção Primária / Hospital Geral</text>
  <text x="160" y="102" class="quote" fill="#ffffff" opacity="0.95">"Preciso decidir com confiança, sem ter que esperar meses por um especialista."</text>

  <rect x="700" y="30" width="170" height="28" rx="14" fill="#3f8ca6"/>
  <text x="785" y="49" text-anchor="middle" class="tag">Persona Primária — P01</text>
  <rect x="700" y="66" width="170" height="24" rx="12" fill="#2a6b85"/>
  <text x="785" y="83" text-anchor="middle" class="tag" style="font-size:11px">Idade: 30–45 anos</text>

  <!-- Grid columns -->
  <!-- Col 1 -->
  <g>
    <text x="30" y="175" class="label">Ocupação / papel</text>
    <text x="30" y="196" class="body">Clínico generalista sem</text>
    <text x="30" y="214" class="body">expertise em neuroimagem</text>

    <text x="30" y="248" class="label">Conhecimento do domínio</text>
    <text x="30" y="269" class="body">Médio — conhece critérios</text>
    <text x="30" y="287" class="body">clínicos de AD (MMSE/MoCA),</text>
    <text x="30" y="305" class="body">mas não interpreta MRI</text>

    <text x="30" y="339" class="label">Experiência tecnológica</text>
    <text x="30" y="360" class="body">Média — usa prontuário</text>
    <text x="30" y="378" class="body">eletrônico no dia a dia</text>

    <text x="30" y="412" class="label">Ambiente típico de uso</text>
    <text x="30" y="433" class="body">Consultório de atenção</text>
    <text x="30" y="451" class="body">primária; consultas com</text>
    <text x="30" y="469" class="body">tempo limitado</text>
  </g>

  <!-- Col 2 -->
  <g>
    <text x="320" y="175" class="label">Objetivos</text>
    <text x="320" y="196" class="body">Diagnosticar Alzheimer com</text>
    <text x="320" y="214" class="body">confiança e rapidez, sem</text>
    <text x="320" y="232" class="body">depender de especialista</text>

    <text x="320" y="266" class="label">Necessidades</text>
    <text x="320" y="287" class="body">Explicação clara (imagem +</text>
    <text x="320" y="305" class="body">dados clínicos), score de</text>
    <text x="320" y="323" class="body">confiança compreensível,</text>
    <text x="320" y="341" class="body">forma fácil de documentar</text>

    <text x="320" y="375" class="label">Motivadores</text>
    <text x="320" y="396" class="body">Cuidar bem do paciente,</text>
    <text x="320" y="414" class="body">evitar erro, ter respaldo</text>
    <text x="320" y="432" class="body">documental para se proteger</text>
  </g>

  <!-- Col 3 -->
  <g>
    <text x="610" y="175" class="label">Dores / frustrações</text>
    <text x="610" y="196" class="body">Fila de espera por</text>
    <text x="610" y="214" class="body">especialista; discordância</text>
    <text x="610" y="232" class="body">entre pareceres; falta de</text>
    <text x="610" y="250" class="body">justificativa técnica</text>

    <text x="610" y="284" class="label">Restrições / acessibilidade</text>
    <text x="610" y="305" class="body">Tempo curto por caso;</text>
    <text x="610" y="323" class="body">iluminação variável;</text>
    <text x="610" y="341" class="body">estação compartilhada</text>

    <text x="610" y="375" class="label">Comportamentos relevantes</text>
    <text x="610" y="396" class="body">Consulta MMSE/MoCA;</text>
    <text x="610" y="414" class="body">liga para colega em caso</text>
    <text x="610" y="432" class="body">de dúvida; documenta no</text>
    <text x="610" y="450" class="body">prontuário</text>
  </g>

  <line x1="30" y1="505" x2="870" y2="505" stroke="#c7d9df" stroke-width="1"/>

  <text x="30" y="530" class="label" fill="#1d4e6b">Decisões de design influenciadas por P01</text>
  <text x="30" y="552" class="body">• Explicação em linguagem clínica, nunca só jargão de ML (Grad-CAM/SHAP cru)</text>
  <text x="30" y="571" class="body">• Score de confiança sempre acompanhado de contexto — nunca um número isolado</text>
  <text x="30" y="590" class="body">• Encaminhar a especialista deve ser uma ação sempre visível, não escondida em menu</text>

  <rect x="0" y="600" width="900" height="20" fill="#1d4e6b"/>
  <text x="450" y="614" text-anchor="middle" class="footer">Base: proto-persona — Entrega 1 (itens 2.2, 2.4, 7.2, 7.3) · Hipótese relacionada: H03</text>
</svg>
