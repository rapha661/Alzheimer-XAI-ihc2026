  <text x="446" y="546" text-anchor="middle" font-size="12">objetivo</text>
  <text x="446" y="560" text-anchor="middle" font-size="12">1/2</text>
  <text x="446" y="580" text-anchor="middle" font-size="12" font-style="italic">seleção</text>
  <rect x="506" y="532" width="96" height="34" fill="#fff" stroke="#000"/>
  <text x="554" y="546" text-anchor="middle" font-size="12">objetivo</text>
  <text x="554" y="560" text-anchor="middle" font-size="12">1+2</text>
  <text x="554" y="580" text-anchor="middle" font-size="12" font-style="italic">paralelo</text>
