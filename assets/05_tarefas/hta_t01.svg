  <rect x="738.5" y="30" width="251" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="864.0" y="48.0" text-anchor="middle" font-size="13.5">0. Retomar a conduta do paciente</text>
  <text x="864.0" y="64.0" text-anchor="middle" font-size="13.5">já avaliado por especialista</text>
  <text x="864.0" y="80.0" text-anchor="middle" font-size="13.5">1&gt;2&gt;3&gt;4</text>
  <rect x="142.5" y="150" width="173" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="229.0" y="168.0" text-anchor="middle" font-size="13.5">1. Avaliar a situação</text>
  <text x="229.0" y="184.0" text-anchor="middle" font-size="13.5">atual do paciente</text>
  <text x="229.0" y="200.0" text-anchor="middle" font-size="13.5">1+2</text>
  <rect x="40.0" y="270" width="180" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="130.0" y="296.0" text-anchor="middle" font-size="13.5">1.1. Ouvir o relato do</text>
  <text x="130.0" y="312.0" text-anchor="middle" font-size="13.5">filho sobre a piora</text>
  <line x1="40.0" y1="333" x2="220.0" y2="333" stroke="#000" stroke-width="1.2"/>
  <rect x="238.0" y="270" width="180" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="328.0" y="296.0" text-anchor="middle" font-size="13.5">1.2. Reaplicar o teste</text>
  <text x="328.0" y="312.0" text-anchor="middle" font-size="13.5">de memória (MMSE/MoCA)</text>
  <line x1="238.0" y1="333" x2="418.0" y2="333" stroke="#000" stroke-width="1.2"/>
  <rect x="648.0" y="150" width="187" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="741.5" y="168.0" text-anchor="middle" font-size="13.5">2. Recuperar o contexto</text>
  <text x="741.5" y="184.0" text-anchor="middle" font-size="13.5">do parecer anterior</text>
  <text x="741.5" y="200.0" text-anchor="middle" font-size="13.5">1&gt;2&gt;3</text>
  <rect x="436.0" y="270" width="187" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="529.5" y="296.0" text-anchor="middle" font-size="13.5">2.1. Abrir o prontuário</text>
  <text x="529.5" y="312.0" text-anchor="middle" font-size="13.5">do paciente</text>
  <line x1="436.0" y1="333" x2="623.0" y2="333" stroke="#000" stroke-width="1.2"/>
  <rect x="641.0" y="270" width="201" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="741.5" y="296.0" text-anchor="middle" font-size="13.5">2.2. Localizar a anotação</text>
  <text x="741.5" y="312.0" text-anchor="middle" font-size="13.5">do parecer</text>
  <line x1="641.0" y1="333" x2="842.0" y2="333" stroke="#000" stroke-width="1.2"/>
  <rect x="860.0" y="270" width="187" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="953.5" y="288.0" text-anchor="middle" font-size="13.5">2.3. Obter os critérios</text>
  <text x="953.5" y="304.0" text-anchor="middle" font-size="13.5">do neurologista</text>
  <text x="953.5" y="320.0" text-anchor="middle" font-size="13.5">1/2</text>
  <rect x="783.5" y="390" width="150" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="858.5" y="416.0" text-anchor="middle" font-size="13.5">2.3.1. Ligar para</text>
  <text x="858.5" y="432.0" text-anchor="middle" font-size="13.5">o neurologista</text>
  <line x1="783.5" y1="453" x2="933.5" y2="453" stroke="#000" stroke-width="1.2"/>
  <rect x="951.5" y="390" width="194" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="1048.5" y="416.0" text-anchor="middle" font-size="13.5">2.3.2. Reconstruir pelos</text>
  <text x="1048.5" y="432.0" text-anchor="middle" font-size="13.5">exames anteriores</text>
  <line x1="951.5" y1="453" x2="1145.5" y2="453" stroke="#000" stroke-width="1.2"/>
  <rect x="1225.0" y="150" width="166" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="1308.0" y="176.0" text-anchor="middle" font-size="13.5">3. Decidir a conduta</text>
  <text x="1308.0" y="192.0" text-anchor="middle" font-size="13.5">1/2/3</text>
  <rect x="1065.0" y="270" width="150" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="1140.0" y="296.0" text-anchor="middle" font-size="13.5">3.1. Solicitar</text>
  <text x="1140.0" y="312.0" text-anchor="middle" font-size="13.5">novo exame</text>
  <line x1="1065.0" y1="333" x2="1215.0" y2="333" stroke="#000" stroke-width="1.2"/>
  <rect x="1233.0" y="270" width="150" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="1308.0" y="296.0" text-anchor="middle" font-size="13.5">3.2. Reencaminhar</text>
  <text x="1308.0" y="312.0" text-anchor="middle" font-size="13.5">ao neurologista</text>
  <line x1="1233.0" y1="333" x2="1383.0" y2="333" stroke="#000" stroke-width="1.2"/>
  <rect x="1401.0" y="270" width="150" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="1476.0" y="296.0" text-anchor="middle" font-size="13.5">3.3. Conduzir sem</text>
  <text x="1476.0" y="312.0" text-anchor="middle" font-size="13.5">o especialista</text>
  <line x1="1401.0" y1="333" x2="1551.0" y2="333" stroke="#000" stroke-width="1.2"/>
  <rect x="1409.0" y="150" width="180" height="58" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
  <text x="1499.0" y="176.0" text-anchor="middle" font-size="13.5">4. Registrar a decisão</text>
  <text x="1499.0" y="192.0" text-anchor="middle" font-size="13.5">no prontuário</text>
  <line x1="1409.0" y1="213" x2="1589.0" y2="213" stroke="#000" stroke-width="1.2"/>
