lo setor de imagem: o modelo não conseguiu medir o hipocampo, porque a série T1 tem</text><text x="338" y="281" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">artefato de movimento. O reenvio é feito pelo técnico. Você pode decidir com as evidências do caso ou</text><text x="338" y="301" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">aguardar o novo resultado.</text></g><text x="296" y="355" font-family="Inter" font-size="12.5" font-weight="600" fill="#5B6472">Status do caso</text><rect x="296" y="367" width="125" height="22" rx="11" fill="#FFFAEB"/><text x="306" y="382" font-family="Inter" font-size="12" font-weight="600" fill="#B45309">Reenvio pendente</text><g id="link_ver_evidencias"><text x="296" y="425" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3">←  Voltar às evidências do caso</text></g></svg>