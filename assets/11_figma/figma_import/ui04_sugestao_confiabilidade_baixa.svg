<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1742" viewBox="0 0 1440 1742"><title>UI04 — Sugestão com confiabilidade baixa</title><rect x="0" y="0" width="1440" height="1742" fill="#F6F7F9"/><g id="barra_lateral"><rect x="0" y="0" width="248" height="1742" fill="#FBFBFC"/><line x1="248" y1="0" x2="248" y2="1742" stroke="#E3E6EC" stroke-width="1"/><rect x="24" y="22" width="34" height="34" rx="8" fill="#3346D3"/><text x="41" y="45" font-family="Inter" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">M</text><text x="68" y="37" font-family="Inter" font-size="15" font-weight="700" fill="#111827">M-XAI</text><text x="68" y="53" font-family="Inter" font-size="11.5" font-weight="400" fill="#5B6472">Apoio à investigação cognitiva</text><g id="menu_casos"><rect x="16" y="96" width="216" height="38" rx="8" fill="#EDEFF3"/><rect x="16" y="104" width="3" height="22" rx="1.5" fill="#3346D3"/><rect x="34" y="108" width="16" height="14" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/><text x="64" y="120" font-family="Inter" font-size="14" font-weight="600" fill="#111827">Casos</text></g><line x1="16" y1="1646" x2="232" y2="1646" stroke="#E3E6EC" stroke-width="1"/><g id="usuario_logado"><circle cx="42" cy="1684" r="18" fill="#EEF0FD"/><text x="42" y="1689" font-family="Inter" font-size="12.5" font-weight="700" fill="#3346D3" text-anchor="middle">CM</text><text x="70" y="1679" font-family="Inter" font-size="13.5" font-weight="600" fill="#111827">César Andrade de Melo</text><text x="70" y="1697" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">Neurologista</text></g><g id="link_sair"><text x="70" y="1722" font-family="Inter" font-size="12.5" font-weight="600" fill="#3346D3">Sair</text></g></g><g id="link_voltar_casos"><path d="M306,40 L296,40 M301,35 L296,40 L301,45" fill="none" stroke="#5B6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="314" y="44" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Casos</text></g><text x="296" y="92" font-family="Inter" font-size="28" font-weight="700" fill="#111827">Roberto Mendes</text><rect x="535.6" y="72" width="137.6" height="22" rx="11" fill="#EEF0FD"/><text x="545.6" y="87" font-family="Inter" font-size="12" font-weight="600" fill="#3346D3">Aguardando revisão</text><text x="296" y="122" font-family="Inter" font-size="14" font-weight="400" fill="#5B6472">PAC-0027  ·  76 anos  ·  masculino  ·  RM em 05/06/2026</text><g id="btn_registrar_decisao"><rect x="1237.8" y="64" width="154.2" height="44" rx="8" fill="#3346D3"/><text x="1314.9" y="91" font-family="Inter" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Registrar decisão</text></g><g id="abas_do_caso"><g id="aba_evidencias"><text x="312" y="164" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Evidências do caso</text></g><g id="aba_sugestao"><text x="478.2" y="164" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3">Sugestão do modelo</text><rect x="462.2" y="178" width="170.5" height="3" fill="#3346D3"/></g><g id="aba_decisao"><text x="652.7" y="164" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Decisão</text></g><line x1="296" y1="181" x2="1392" y2="181" stroke="#E3E6EC" stroke-width="1"/></g><g id="painel_imagem"><rect x="296" y="209" width="520" height="588" rx="12" fill="#0B0F1A"/><text x="316" y="239" font-family="Inter" font-size="11.5" font-weight="600" fill="#AEB6C6">CORTE AXIAL · NÍVEL DOS HIPOCAMPOS</text><text x="796" y="239" font-family="Inter" font-size="11.5" font-weight="500" fill="#AEB6C6" text-anchor="end">RM de 05/06/2026</text><g id="ressonancia_ilustracao"><rect x="316" y="253" width="480" height="480" fill="#05070D"/><ellipse cx="556" cy="493" rx="163.6" ry="201.8" fill="#3B404B" stroke="#C9CED8" stroke-width="9.8"/><ellipse cx="556" cy="493" rx="144" ry="181.1" fill="#7D838F"/><ellipse cx="556" cy="493" rx="106.9" ry="139.6" fill="#A3A8B2"/><path d="M549.5,436.3 C512.4,438.5 508,503.9 542.9,525.7 Z" fill="#1C2029"/><path d="M562.5,436.3 C599.6,438.5 604,503.9 569.1,525.7 Z" fill="#1C2029"/><line x1="556" y1="318.5" x2="556" y2="667.5" stroke="#5E6470" stroke-width="2.1818181818181817"/><defs><radialGradient id="h1"><stop offset="0" stop-color="#F23B2E" stop-opacity="0.9"/><stop offset="0.5" stop-color="#F2D33A" stop-opacity="0.55"/><stop offset="1" stop-color="#22C1C3" stop-opacity="0"/></radialGradient></defs><circle cx="486.2" cy="565" r="54.5" fill="url(#h1)"/><circle cx="628" cy="569.4" r="50.2" fill="url(#h1)"/><circle cx="545.1" cy="445" r="45.8" fill="url(#h1)"/></g><rect x="296" y="741" width="520" height="56" fill="#121829"/><text x="316" y="765" font-family="Inter" font-size="12.5" font-weight="500" fill="#E5E7EB">Mapa de atenção (Grad-CAM): onde o modelo se apoiou, não uma lesão.</text><defs><linearGradient id="lg2" x1="0" x2="1"><stop offset="0" stop-color="#22C1C3"/><stop offset=".5" stop-color="#F2D33A"/><stop offset="1" stop-color="#F23B2E"/></linearGradient></defs><text x="316" y="785" font-family="Inter" font-size="11" font-weight="400" fill="#AEB6C6">menor</text><rect x="358" y="777" width="70" height="8" rx="4" fill="url(#lg2)"/><text x="436" y="785" font-family="Inter" font-size="11" font-weight="400" fill="#AEB6C6">maior</text><text x="796" y="785" font-family="Inter" font-size="11" font-weight="400" fill="#8A93A1" text-anchor="end">Ilustração esquemática do exame</text></g><g id="aviso_fixo_o_que_o_modelo_nao_avalia"><rect x="840" y="209" width="552" height="86" rx="10" fill="#F0F4FF" stroke="#C7D0FB" stroke-width="1"/><circle cx="862" cy="233" r="8" fill="none" stroke="#3346D3" stroke-width="1.5"/><path d="M862,232 L862,237" fill="none" stroke="#3346D3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="862" cy="229" r="1.1" fill="#3346D3"/><text x="882" y="238" font-family="Inter" font-size="14" font-weight="600" fill="#111827">O que o modelo não avalia</text><text x="882" y="261" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">O modelo analisa padrões de imagem e dados clínicos. Não avalia</text><text x="882" y="281" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">capacidade funcional nem aptidão para dirigir.</text></g><g id="card_sugestao"><rect x="840" y="311" width="552" height="350" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="864" y="345" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">Sugestão do modelo</text><rect x="1166" y="331" width="202" height="22" rx="11" fill="#EEF0F3"/><text x="1176" y="346" font-family="Inter" font-size="11.5" font-weight="600" fill="#5B6472">apoio à decisão, não diagnóstico</text><text x="864" y="377" font-family="Inter" font-size="21" font-weight="700" fill="#111827">Padrão compatível com Alzheimer</text><text x="864" y="413" font-family="Inter" font-size="13" font-weight="600" fill="#111827">Probabilidade da classe</text><text x="864" y="441" font-family="Inter" font-size="14" font-weight="600" fill="#111827">Alzheimer</text><text x="1368" y="441" font-family="Inter" font-size="14" font-weight="700" fill="#111827" text-anchor="end">58%</text><rect x="864" y="450" width="504" height="8" rx="4" fill="#EDEFF3"/><rect x="864" y="450" width="292.3" height="8" rx="4" fill="#3346D3"/><text x="864" y="481" font-family="Inter" font-size="14" font-weight="400" fill="#5B6472">Normal</text><text x="1368" y="481" font-family="Inter" font-size="14" font-weight="400" fill="#5B6472" text-anchor="end">42%</text><rect x="864" y="490" width="504" height="8" rx="4" fill="#EDEFF3"/><rect x="864" y="490" width="211.7" height="8" rx="4" fill="#AEB6C6"/><line x1="864" y1="511" x2="1368" y2="511" stroke="#E3E6EC" stroke-width="1"/><text x="864" y="541" font-family="Inter" font-size="13" font-weight="600" fill="#111827">Confiabilidade desta estimativa</text><g id="termo_confiabilidade"><circle cx="1075.7" cy="537" r="8" fill="none" stroke="#3346D3" stroke-width="1.5"/><path d="M1075.6779999999999,536 L1075.6779999999999,541" fill="none" stroke="#3346D3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1075.7" cy="533" r="1.1" fill="#3346D3"/></g><rect x="1285.2" y="523" width="82.8" height="26" rx="13" fill="#FEF3F2" stroke="#FECDCA" stroke-width="1"/><rect x="1297.2" y="536" width="4" height="4" rx="1" fill="#C81E1E"/><rect x="1303.2" y="532" width="4" height="8" rx="1" fill="#D5DAE2"/><rect x="1309.2" y="528" width="4" height="12" rx="1" fill="#D5DAE2"/><text x="1321.2" y="541" font-family="Inter" font-size="13" font-weight="700" fill="#C81E1E">Baixa</text><text x="864" y="571" font-family="Inter" font-size="13.5" font-weight="400" fill="#5B6472">As probabilidades estão próximas (58% e 42%) e o volume do hipocampo não</text><text x="864" y="591" font-family="Inter" font-size="13.5" font-weight="400" fill="#5B6472">foi informado no envio: o modelo usou um valor estimado.</text><rect x="864" y="609" width="504" height="40" rx="8" fill="#F3F4F6"/><text x="880" y="634" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Uma probabilidade alta não é certeza clínica: a conclusão é sua.</text></g><g id="card_peso_de_cada_modalidade"><rect x="840" y="677" width="552" height="128" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="864" y="711" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Peso de cada modalidade</text><rect x="864" y="727" width="154.4" height="10" rx="5" fill="#3346D3"/><rect x="1024.4" y="727" width="343.6" height="10" rx="5" fill="#0F8F76"/><text x="864" y="763" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Imagem (RM)</text><text x="864" y="789" font-family="Inter" font-size="20" font-weight="700" fill="#111827">31%</text><text x="1116" y="763" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Dados enviados ao modelo</text><text x="1116" y="789" font-family="Inter" font-size="20" font-weight="700" fill="#111827">69%</text></g><g id="card_o_que_mais_pesou"><rect x="840" y="821" width="552" height="465" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="864" y="855" font-family="Inter" font-size="15" font-weight="600" fill="#111827">O que mais pesou neste caso</text><text x="864" y="883" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Fator mais relevante</text><text x="864" y="907" font-family="Inter" font-size="17" font-weight="700" fill="#111827">Ressonância magnética</text><text x="864" y="931" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">Moveu o caso 10,4 pontos em direção a Alzheimer. Entre os dados clínicos, o</text><text x="864" y="951" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">que mais pesou foi o volume dos ventrículos laterais (9,1 pontos).</text><text x="864" y="981" font-family="Inter" font-size="11.5" font-weight="500" fill="#6B7280">← em direção a Normal</text><text x="1368" y="981" font-family="Inter" font-size="11.5" font-weight="500" fill="#6B7280" text-anchor="end">em direção a Alzheimer →</text><text x="864" y="1011" font-family="Inter" font-size="14" font-weight="500" fill="#111827">Ressonância magnética</text><text x="1368" y="1011" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="end">+10,4</text><rect x="864" y="1020" width="504" height="6" rx="3" fill="#EDEFF3"/><rect x="1116" y="1020" width="163.8" height="6" rx="3" fill="#C2410C"/><line x1="1116" y1="1017" x2="1116" y2="1029" stroke="#9AA3B2" stroke-width="1"/><text x="864" y="1051" font-family="Inter" font-size="14" font-weight="500" fill="#111827">Ventrículos laterais</text><text x="1001" y="1051" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">41.900 mm³</text><text x="1368" y="1051" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="end">+9,1</text><rect x="864" y="1060" width="504" height="6" rx="3" fill="#EDEFF3"/><rect x="1116" y="1060" width="143.3" height="6" rx="3" fill="#C2410C"/><line x1="1116" y1="1057" x2="1116" y2="1069" stroke="#9AA3B2" stroke-width="1"/><text x="864" y="1091" font-family="Inter" font-size="14" font-weight="500" fill="#111827">Volume do hipocampo</text><text x="1022.2" y="1091" font-family="Inter" font-size="12" font-weight="400" fill="#B45309">estimado</text><text x="1368" y="1091" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="end">+6,2</text><rect x="864" y="1100" width="504" height="6" rx="3" fill="#EDEFF3"/><rect x="1116" y="1100" width="97.7" height="6" rx="3" fill="#C2410C"/><line x1="1116" y1="1097" x2="1116" y2="1109" stroke="#9AA3B2" stroke-width="1"/><text x="864" y="1131" font-family="Inter" font-size="14" font-weight="500" fill="#111827">Escolaridade</text><text x="958.4" y="1131" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">4 anos</text><text x="1368" y="1131" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="end">+4,0</text><rect x="864" y="1140" width="504" height="6" rx="3" fill="#EDEFF3"/><rect x="1116" y="1140" width="63" height="6" rx="3" fill="#C2410C"/><line x1="1116" y1="1137" x2="1116" y2="1149" stroke="#9AA3B2" stroke-width="1"/><text x="864" y="1171" font-family="Inter" font-size="14" font-weight="500" fill="#111827">Estado civil</text><text x="948.3" y="1171" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Viúvo</text><text x="1368" y="1171" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="end">−2,1</text><rect x="864" y="1180" width="504" height="6" rx="3" fill="#EDEFF3"/><rect x="1082.9" y="1180" width="33.1" height="6" rx="3" fill="#0F8F76"/><line x1="1116" y1="1177" x2="1116" y2="1189" stroke="#9AA3B2" stroke-width="1"/><text x="864" y="1211" font-family="Inter" font-size="14" font-weight="500" fill="#111827">Outros 3 dados</text><text x="1368" y="1211" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="end">+1,4</text><rect x="864" y="1220" width="504" height="6" rx="3" fill="#EDEFF3"/><rect x="1116" y="1220" width="22" height="6" rx="3" fill="#C2410C"/><line x1="1116" y1="1217" x2="1116" y2="1229" stroke="#9AA3B2" stroke-width="1"/><text x="864" y="1255" font-family="Inter" font-size="12" font-weight="400" fill="#5B6472">Em pontos de probabilidade de Alzheimer, a partir de um paciente de referência com os</text><text x="864" y="1272" font-family="Inter" font-size="12" font-weight="400" fill="#5B6472">valores médios do treino (29%). Mostra o que pesou no modelo, não a causa da doença.</text></g><g id="card_limites_da_sugestao"><rect x="840" y="1302" width="552" height="152" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><path d="M872,1323 L882,1340 L862,1340 Z" fill="#5B6472" stroke="#5B6472" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M872,1329 L872,1334" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="872" cy="1337" r="1.2" fill="#fff"/><text x="890" y="1337" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Limites da sugestão</text><text x="864" y="1366" font-family="Inter" font-size="13" font-weight="400" fill="#111827">Treinado na base ADNI; não validado na população brasileira.</text><text x="864" y="1388" font-family="Inter" font-size="13" font-weight="400" fill="#111827">Distingue só normal e Alzheimer; não avalia comprometimento cognitivo leve.</text><text x="864" y="1410" font-family="Inter" font-size="13" font-weight="400" fill="#111827">Não avalia capacidade funcional nem aptidão para dirigir.</text><text x="864" y="1440" font-family="Inter" font-size="11.5" font-weight="400" fill="#6B7280">Fusão tardia: ResNet50 (imagem) + Random Forest (dados)</text></g><g id="dados_enviados_ao_modelo"><rect x="296" y="1478" width="1096" height="216" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="1514" font-family="Inter" font-size="16" font-weight="600" fill="#111827">Dados enviados ao modelo</text><text x="540.3" y="1514" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472">o que o modelo recebeu para calcular a sugestão</text><rect x="320" y="1534" width="253" height="64" rx="8" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="334" y="1556" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Idade</text><text x="334" y="1580" font-family="Inter" font-size="15" font-weight="600" fill="#111827">76 anos</text><rect x="585" y="1534" width="253" height="64" rx="8" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="599" y="1556" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Sexo</text><text x="599" y="1580" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Masculino</text><rect x="850" y="1534" width="253" height="64" rx="8" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="864" y="1556" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Escolaridade</text><text x="864" y="1580" font-family="Inter" font-size="15" font-weight="600" fill="#111827">4 anos</text><rect x="1115" y="1534" width="253" height="64" rx="8" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="1129" y="1556" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Estado civil</text><text x="1129" y="1580" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Viúvo</text><rect x="320" y="1608" width="253" height="64" rx="8" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="334" y="1630" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">APOE</text><text x="334" y="1654" font-family="Inter" font-size="15" font-weight="600" fill="#111827">ε3/ε3</text><text x="559" y="1654" font-family="Inter" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="end">nenhum alelo ε4</text><rect x="585" y="1608" width="253" height="64" rx="8" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="599" y="1630" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">ICV</text><text x="599" y="1654" font-family="Inter" font-size="15" font-weight="600" fill="#111827">1.520.000 mm³</text><rect x="850" y="1608" width="253" height="64" rx="8" fill="#FFFAEB" stroke="#FEDF89" stroke-width="1"/><text x="864" y="1630" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Hipocampo</text><text x="864" y="1654" font-family="Inter" font-size="15" font-weight="600" fill="#B45309">Estimado</text><text x="1089" y="1654" font-family="Inter" font-size="11.5" font-weight="400" fill="#B45309" text-anchor="end">não informado no envio</text><rect x="1115" y="1608" width="253" height="64" rx="8" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="1129" y="1630" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Ventrículos laterais</text><text x="1129" y="1654" font-family="Inter" font-size="15" font-weight="600" fill="#111827">41.900 mm³</text><text x="1354" y="1654" font-family="Inter" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="end">2,76% do ICV</text></g></svg>