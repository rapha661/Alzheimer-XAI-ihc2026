</g>
<g id="painel_o_que_e_conferido">
<rect x="1080.0" y="124.0" width="312.0" height="300.0" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/>
<text x="1100.0" y="156.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="start">O que é conferido antes do envio</text>
<text x="1100.0" y="186.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start">Pela plataforma</text>
<text x="1100.0" y="206.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start">tipo de série, cobertura, nome no</text>
<text x="1100.0" y="225.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start">cabeçalho e faixas plausíveis dos volumes.</text>
<text x="1100.0" y="255.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start">Por você</text>
<text x="1100.0" y="275.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start">artefato de movimento, que só a leitura</text>
<text x="1100.0" y="294.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start">visual identifica.</text>
<text x="1100.0" y="324.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start">Depois do envio</text>
<text x="1100.0" y="344.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start">a análise do modelo leva cerca de 3</text>
<text x="1100.0" y="363.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start">minutos. Se puder, aguarde o resultado</text>
<text x="1100.0" y="382.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start">antes de liberar o paciente.</text>
</g>
