<text x="676.0" y="436.0" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6472" text-anchor="middle">DICOM em .zip ou NIfTI (.nii, .nii.gz)</text>
</g>
