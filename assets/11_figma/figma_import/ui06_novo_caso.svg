<rect x="320.0" y="1020.0" width="712.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/>
<text x="332.0" y="1045.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Opcional</text>
