<text x="320.0" y="902.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start">Fica visível para o médico ao lado da sugestão. Copie do pedido ou do prontuário.</text>
<text x="320.0" y="934.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start">MMSE</text>
<rect x="320.0" y="942.0" width="226.7" height="40.0" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/>
<text x="534.7" y="967.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6472" text-anchor="end">/ 30</text>
<text x="562.7" y="934.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start">MoCA</text>
<rect x="562.7" y="942.0" width="226.7" height="40.0" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/>
<text x="777.3" y="967.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6472" text-anchor="end">/ 30</text>
<text x="805.3" y="934.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start">Data dos testes</text>
<rect x="805.3" y="942.0" width="226.7" height="40.0" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/>
