<rect x="684.0" y="196.0" width="348.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/>
<text x="696.0" y="221.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Ex.: PAC-0031</text>
