<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>UI06 — Preparar e enviar o exame</title><rect x="0" y="0" width="1440" height="900" fill="#F6F7F9"/><g id="barra_lateral"><rect x="0" y="0" width="248" height="900" fill="#FBFBFC"/><line x1="248" y1="0" x2="248" y2="900" stroke="#E3E6EC" stroke-width="1"/><rect x="24" y="22" width="34" height="34" rx="8" fill="#3346D3"/><text x="41" y="45" font-family="Inter" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">M</text><text x="68" y="37" font-family="Inter" font-size="15" font-weight="700" fill="#111827">M-XAI</text><text x="68" y="53" font-family="Inter" font-size="11.5" font-weight="400" fill="#5B6472">Apoio à investigação cognitiva</text><g id="menu_novo"><rect x="16" y="96" width="216" height="38" rx="8" fill="#EDEFF3"/><rect x="16" y="104" width="3" height="22" rx="1.5" fill="#3346D3"/><rect x="34" y="108" width="16" height="14" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/><text x="64" y="120" font-family="Inter" font-size="14" font-weight="600" fill="#111827">Novo exame</text></g><line x1="16" y1="804" x2="232" y2="804" stroke="#E3E6EC" stroke-width="1"/><g id="usuario_logado"><circle cx="42" cy="842" r="18" fill="#EEF0FD"/><text x="42" y="847" font-family="Inter" font-size="12.5" font-weight="700" fill="#3346D3" text-anchor="middle">BT</text><text x="70" y="837" font-family="Inter" font-size="13.5" font-weight="600" fill="#111827">Bruno Tavares Lima</text><text x="70" y="855" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">Técnico em radiologia</text></g><g id="link_sair"><text x="70" y="880" font-family="Inter" font-size="12.5" font-weight="600" fill="#3346D3">Sair</text></g></g><text x="296" y="64" font-family="Inter" font-size="28" font-weight="700" fill="#111827">Novo exame</text><text x="296" y="92" font-family="Inter" font-size="14" font-weight="400" fill="#5B6472">Aparecida Souza  ·  PAC-0031  ·  74 anos  ·  pedido de 16/11/2026</text><g id="etapas_do_envio"><rect x="296" y="116" width="106.6" height="34" rx="17" fill="#EEF0FD"/><circle cx="314" cy="133" r="9" fill="#3346D3"/><text x="314" y="137" font-family="Inter" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="330" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#3346D3">Preparar</text><rect x="410.6" y="116" width="185.2" height="34" rx="17" fill="#EEF0F3"/><circle cx="428.6" cy="133" r="9" fill="#C3C9D4"/><text x="428.6" y="137" font-family="Inter" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="444.6" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">Confirmar identidade</text><rect x="603.8" y="116" width="204.8" height="34" rx="17" fill="#EEF0F3"/><circle cx="621.8" cy="133" r="9" fill="#C3C9D4"/><text x="621.8" y="137" font-family="Inter" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="637.8" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">Conferir antes de liberar</text><rect x="816.5" y="116" width="191.3" height="34" rx="17" fill="#EEF0F3"/><circle cx="834.5" cy="133" r="9" fill="#C3C9D4"/><text x="834.5" y="137" font-family="Inter" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="850.5" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">Acompanhar a análise</text></g><g id="card_pedido"><rect x="296" y="176" width="640" height="150" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="212" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Pedido médico</text><text x="912" y="212" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472" text-anchor="end">Dr. Marcos Andrade · Clínica médica</text><text x="320" y="242" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Suspeita informada</text><text x="320" y="266" font-family="Inter" font-size="16" font-weight="600" fill="#111827">RM de crânio — investigação de déficit cognitivo</text><text x="320" y="300" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472">Acompanhante: Rogério Souza (filho)</text></g><g id="card_o_que_o_protocolo_exige"><rect x="296" y="342" width="640" height="300" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="378" font-family="Inter" font-size="15" font-weight="600" fill="#111827">O que o protocolo do serviço exige para esta suspeita</text><text x="320" y="408" font-family="Inter" font-size="12.5" font-weight="600" fill="#5B6472">Sequências exigidas</text><rect x="320" y="424" width="8" height="8" rx="2" fill="#3346D3"/><text x="338" y="433" font-family="Inter" font-size="14" font-weight="600" fill="#111827">T1 volumétrica (MPRAGE)</text><text x="521.1" y="433" font-family="Inter" font-size="12.5" font-weight="400" fill="#3346D3">usada pela análise do modelo</text><rect x="320" y="452" width="8" height="8" rx="2" fill="#9AA3B2"/><text x="338" y="461" font-family="Inter" font-size="14" font-weight="400" fill="#111827">FLAIR axial</text><rect x="320" y="480" width="8" height="8" rx="2" fill="#9AA3B2"/><text x="338" y="489" font-family="Inter" font-size="14" font-weight="400" fill="#111827">T2 axial</text><rect x="320" y="508" width="8" height="8" rx="2" fill="#9AA3B2"/><text x="338" y="517" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Difusão (DWI)</text><text x="320" y="564" font-family="Inter" font-size="12.5" font-weight="600" fill="#5B6472">Dados clínicos obrigatórios</text><rect x="320" y="578" width="53.6" height="22" rx="11" fill="#EEF0F3"/><text x="330" y="593" font-family="Inter" font-size="12.5" font-weight="600" fill="#5B6472">Idade</text><rect x="381.6" y="578" width="62.3" height="22" rx="11" fill="#EEF0F3"/><text x="391.6" y="593" font-family="Inter" font-size="12.5" font-weight="600" fill="#5B6472">Queixa</text><rect x="451.9" y="578" width="224" height="22" rx="11" fill="#EEF0F3"/><text x="461.9" y="593" font-family="Inter" font-size="12.5" font-weight="600" fill="#5B6472">Teste cognitivo (MMSE ou MoCA)</text><text x="320" y="626" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">Os dados vêm do prontuário; o que faltar aparece como pendência na conferência.</text></g><g id="card_tempo_e_agenda"><rect x="960" y="176" width="432" height="240" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="984" y="212" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Tempo e agenda</text><circle cx="992" cy="246" r="7" fill="none" stroke="#5B6472" stroke-width="1.5"/><path d="M992,242 L992,246 L995,248" fill="none" stroke="#5B6472" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1008" y="251" font-family="Inter" font-size="13" font-weight="500" fill="#5B6472">Duração prevista do protocolo</text><text x="984" y="284" font-family="Inter" font-size="26" font-weight="700" fill="#111827">28 min</text><text x="984" y="320" font-family="Inter" font-size="14" font-weight="500" fill="#111827">Início: 9h05   ·   Próximo paciente: 9h40</text><rect x="984" y="336" width="384" height="8" rx="4" fill="#EDEFF3"/><rect x="984" y="336" width="307.2" height="8" rx="4" fill="#3346D3"/><text x="984" y="370" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472">Folga de 7 min. Repetir uma sequência curta cabe; repetir o</text><text x="984" y="389" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472">protocolo inteiro, não.</text></g><g id="btn_conferir_identidade"><rect x="1202" y="662" width="190" height="44" rx="8" fill="#3346D3"/><text x="1297" y="689" font-family="Inter" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Conferir a identidade</text></g></svg>