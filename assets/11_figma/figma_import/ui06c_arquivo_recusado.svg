<text x="296.0" y="64.0" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="start">Novo caso</text>
<text x="296.0" y="92.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6472" text-anchor="start">Envie a ressonância e os dados do paciente para análise. O exame é conferido assim que o arquivo é escolhido.</text>
