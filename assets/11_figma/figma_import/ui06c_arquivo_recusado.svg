<text x="362.0" y="371.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="start">AparecidaSouza_AX_FLAIR.zip</text>
<text x="1016.0" y="371.0" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6472" text-anchor="end">61 MB</text>
<text x="344.0" y="402.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111827" text-anchor="start">Este arquivo é uma sequência FLAIR. A análise precisa da T1 volumétrica do mesmo exame</text>
<text x="344.0" y="423.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111827" text-anchor="start">(MPRAGE ou equivalente). Selecione a outra série no PACS.</text>
