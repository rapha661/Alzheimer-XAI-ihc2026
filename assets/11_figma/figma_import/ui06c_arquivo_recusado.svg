<text x="320.0" y="942.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start">Fica visível para o médico ao lado da sugestão. Copie do pedido ou do prontuário.</text>
