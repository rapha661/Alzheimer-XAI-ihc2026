74 anos  ·  pedido de 16/11/2026</text><g id="etapas_do_envio"><rect x="296" y="116" width="106.6" height="34" rx="17" fill="#ECFDF3"/><circle cx="314" cy="133" r="8" fill="#15803D"/><path d="M310.4,133 L313.2,135.64 L318,129.96" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#15803D">Preparar</text><rect x="410.6" y="116" width="185.2" height="34" rx="17" fill="#ECFDF3"/><circle cx="428.6" cy="133" r="8" fill="#15803D"/><path d="M424.98699999999997,133 L427.787,135.64 L432.587,129.96" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="444.6" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#15803D">Confirmar identidade</text><rect x="603.8" y="116" width="204.8" height="34" rx="17" fill="#EEF0FD"/><circle cx="621.8" cy="133" r="9" fill="#3346D3"/><text x="621.8" y="137" font-family="Inter" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="637.8" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#3346D3">Conferir antes de liberar</text><rect x="816.5" y="116" width="191.3" height="34" rx="17" fill="#EEF0F3"/><circle cx="834.5" cy="133" r="9" fill="#C3C9D4"/><text x="834.5" y="137" font-family="Inter" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="850.5" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">Acompanhar a análise</text></g><g id="secao_arquivo"><rect x="296" y="176" width="760" height="190" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="212" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Arquivo da ressonância</text><g id="area_arquivo"><rect x="320" y="230" width="712" height="116" rx="10" fill="#FEF3F2" stroke="#FECDCA" stroke-width="1"/><circle cx="344" cy="258" r="9" fill="#C81E1E"/><path d="M340.58,254.58 L347.42,261.42 M347.42,254.58 L340.58,261.42" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="362" y="263" font-family="Inter" font-size="14" font-weight="600" fill="#111827">AparecidaSouza_AX_FLAIR.zip</text><text x="344" y="292" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">A série enviada não é a T1 volumétrica: é uma FLAIR axial. Selecione a T1 volumétrica do mesmo</text><text x="344" y="312" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">exame. Com a paciente ainda no setor, dá para adquirir a sequência que faltar.</text></g><g id="btn_selecionar_outro"><rect x="832" y="190" width="200" height="34" rx="8" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1"/><text x="932" y="212" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Selecionar outro arquivo</text></g></g><g id="secao_dados_clinicos"><rect x="296" y="382" width="760" height="250" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="418" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Dados clínicos</text><text x="1032" y="418" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472" text-anchor="end">vêm do prontuário, sem redigitação</text><text x="320" y="446" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Idade</text><text x="546.7" y="446" font-family="Inter" font-size="11.5" font-weight="500" fill="#6B7280" text-anchor="end">prontuário</text><rect x="320" y="454" width="226.7" height="40" rx="8" fill="#F3F4F6" stroke="#8A93A1" stroke-width="1"/><text x="332" y="479" font-family="Inter" font-size="14" font-weight="400" fill="#111827">74 anos</text><text x="562.7" y="446" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Sexo</text><text x="789.3" y="446" font-family="Inter" font-size="11.5" font-weight="500" fill="#6B7280" text-anchor="end">prontuário</text><rect x="562.7" y="454" width="226.7" height="40" rx="8" fill="#F3F4F6" stroke="#8A93A1" stroke-width="1"/><text x="574.7" y="479" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Feminino</text><text x="805.3" y="446" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Escolaridade</text><text x="1032" y="446" font-family="Inter" font-size="11.5" font-weight="500" fill="#6B7280" text-anchor="end">prontuário</text><rect x="805.3" y="454" width="226.7" height="40" rx="8" fill="#F3F4F6" stroke="#8A93A1" stroke-width="1"/><text x="817.3" y="479" font-family="Inter" font-size="14" font-weight="400" fill="#111827">6 anos</text><text x="320" y="522" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Estado civil</text><text x="546.7" y="522" font-family="Inter" font-size="11.5" font-weight="500" fill="#6B7280" text-anchor="end">prontuário</text><rect x="320" y="530" width="226.7" height="40" rx="8" fill="#F3F4F6" stroke="#8A93A1" stroke-width="1"/><text x="332" y="555" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Viúva</text><text x="562.7" y="522" font-family="Inter" font-size="13" font-weight="500" fill="#111827">APOE</text><text x="789.3" y="522" font-family="Inter" font-size="11.5" font-weight="500" fill="#6B7280" text-anchor="end">prontuário</text><rect x="562.7" y="530" width="226.7" height="40" rx="8" fill="#F3F4F6" stroke="#8A93A1" stroke-width="1"/><text x="574.7" y="555" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Não informado</text><g id="campo_teste_cognitivo"><text x="805.3" y="522" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Teste cognitivo</text><rect x="805.3" y="530" width="226.7" height="40" rx="8" fill="#FFFFFF" stroke="#C81E1E" stroke-width="1.5"/><text x="817.3" y="555" font-family="Inter" font-size="14" font-weight="400" fill="#6B7280">Não consta na requisição</text><circle cx="812.3" cy="585" r="7" fill="#C81E1E"/><path d="M809.6733333333333,582.34 L814.9933333333332,587.66 M814.9933333333332,582.34 L809.6733333333333,587.66" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="825.3" y="590" font-family="Inter" font-size="12.5" font-weight="500" fill="#C81E1E">Pendência obrigatória</text></g></g><g id="secao_volumetria"><rect x="296" y="648" width="760" height="128" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="684" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Volumetria</text><text x="1032" y="684" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472" text-anchor="end">do laudo de volumetria</text><g id="campo_icv"><text x="320" y="712" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Volume intracraniano (ICV)</text><rect x="320" y="720" width="226.7" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="332" y="745" font-family="Inter" font-size="14" font-weight="400" fill="#111827">1.200.000</text><text x="534.7" y="745" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472" text-anchor="end">mm³</text></g><text x="562.7" y="712" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Hipocampo</text><rect x="562.7" y="720" width="226.7" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="574.7" y="745" font-family="Inter" font-size="14" font-weight="400" fill="#111827">5.800</text><text x="777.3" y="745" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472" text-anchor="end">mm³</text><text x="805.3" y="712" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Ventrículos laterais</text><rect x="805.3" y="720" width="226.7" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="817.3" y="745" font-family="Inter" font-size="14" font-weight="400" fill="#111827">36.400</text><text x="1020" y="745" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472" text-anchor="end">mm³</text></g><g id="secao_limitacao"><rect x="296" y="792" width="760" height="112" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="828" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Limitação observada (opcional)</text><text x="320" y="854" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472">Se você aceitar uma imagem com limitação, registre aqui. A limitação acompanha o estudo até quem lauda.</text><g id="btn_registrar_limitacao"><rect x="320" y="866" width="162.4" height="32" rx="8" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1"/><text x="401.2" y="887" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Registrar limitação</text></g></g><g id="painel_pendencias"><rect x="1080" y="176" width="312" height="368" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><rect x="1080" y="176" width="312" height="4" fill="#B45309"/><text x="1104" y="214" font-family="Inter" font-size="16" font-weight="700" fill="#111827">Pendências obrigatórias</text><rect x="1336" y="198" width="27.5" height="22" rx="11" fill="#FFFAEB"/><text x="1346" y="213" font-family="Inter" font-size="12" font-weight="600" fill="#B45309">2</text><rect x="1104" y="240" width="264" height="44" rx="8" fill="#FFFAEB"/><path d="M1124,253 L1134,270 L1114,270 Z" fill="#B45309" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1124,259 L1124,264" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1124" cy="267" r="1.2" fill="#fff"/><text x="1142" y="267" font-family="Inter" font-size="13" font-weight="500" fill="#111827">T1 volumétrica não está entre as</text><text x="1142" y="285" font-family="Inter" font-size="13" font-weight="500" fill="#111827">séries enviadas</text><rect x="1104" y="294" width="264" height="44" rx="8" fill="#FFFAEB"/><path d="M1124,307 L1134,324 L1114,324 Z" fill="#B45309" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1124,313 L1124,318" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1124" cy="321" r="1.2" fill="#fff"/><text x="1142" y="321" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Teste cognitivo não consta na</text><text x="1142" y="339" font-family="Inter" font-size="13" font-weight="500" fill="#111827">requisição</text><text x="1104" y="362" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">O envio fica bloqueado até resolver. A</text><text x="1104" y="380" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">interface aponta; o que fazer com cada</text><text x="1104" y="398" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">pendência é decisão sua e, quando o</text><text x="1104" y="416" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">protocolo exigir, do radiologista.</text><g id="btn_enviar_analise"><rect x="1104" y="436" width="264" height="44" rx="8" fill="#E7EAF0"/><text x="1236" y="463" font-family="Inter" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">Enviar para análise</text></g><g id="btn_cancelar_envio"><rect x="1104" y="488" width="264" height="36" rx="8" fill="none"/><text x="1236" y="511" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3" text-anchor="middle">Cancelar o envio</text></g></g></svg>