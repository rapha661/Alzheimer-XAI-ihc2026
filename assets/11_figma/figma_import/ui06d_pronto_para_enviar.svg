258 L343.1,260.97 L348.5,254.58" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="362" y="263" font-family="Inter" font-size="14" font-weight="600" fill="#111827">AparecidaSouza_T1_MPRAGE.zip</text><text x="1016" y="263" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472" text-anchor="end">84 MB</text><line x1="320" y1="282" x2="1032" y2="282" stroke="#E3E6EC" stroke-width="1"/><text x="344" y="308" font-family="Inter" font-size="12.5" font-weight="600" fill="#5B6472">Série conferida pelo sistema</text><circle cx="352" cy="330" r="7" fill="#15803D"/><path d="M348.85,330 L351.3,332.31 L355.5,327.34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="368" y="335" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">Tipo: T1 volumétrica (MPRAGE)</text><circle cx="352" cy="354" r="7" fill="#15803D"/><path d="M348.85,354 L351.3,356.31 L355.5,351.34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="368" y="359" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">Cobertura: crânio completo</text><circle cx="352" cy="378" r="7" fill="#15803D"/><path d="M348.85,378 L351.3,380.31 L355.5,375.34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="368" y="383" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">Nome no cabeçalho: confere com o pedido</text></g></g><g id="secao_dados_clinicos"><rect x="296" y="428" width="760" height="250" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="464" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Dados clínicos</text><text x="1032" y="464" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472" text-anchor="end">vêm do prontuário, sem redigitação</text><text x="320" y="492" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Idade</text><text x="546.7" y="492" font-family="Inter" font-size="11.5" font-weight="500" fill="#6B7280" text-anchor="end">prontuário</text><rect x="320" y="500" width="226.7" height="40" rx="8" fill="#F3F4F6" stroke="#8A93A1" stroke-width="1"/><text x="332" y="525" font-family="Inter" font-size="14" font-weight="400" fill="#111827">74 anos</text><text x="562.7" y="492" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Sexo</text><text x="789.3" y="492" font-family="Inter" font-size="11.5" font-weight="500" fill="#6B7280" text-anchor="end">prontuário</text><rect x="562.7" y="500" width="226.7" height="40" rx="8" fill="#F3F4F6" stroke="#8A93A1" stroke-width="1"/><text x="574.7" y="525" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Feminino</text><text x="805.3" y="492" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Escolaridade</text><text x="1032" y="492" font-family="Inter" font-size="11.5" font-weight="500" fill="#6B7280" text-anchor="end">prontuário</text><rect x="805.3" y="500" width="226.7" height="40" rx="8" fill="#F3F4F6" stroke="#8A93A1" stroke-width="1"/><text x="817.3" y="525" font-family="Inter" font-size="14" font-weight="400" fill="#111827">6 anos</text><text x="320" y="568" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Estado civil</text><text x="546.7" y="568" font-family="Inter" font-size="11.5" font-weight="500" fill="#6B7280" text-anchor="end">prontuário</text><rect x="320" y="576" width="226.7" height="40" rx="8" fill="#F3F4F6" stroke="#8A93A1" stroke-width="1"/><text x="332" y="601" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Viúva</text><text x="562.7" y="568" font-family="Inter" font-size="13" font-weight="500" fill="#111827">APOE</text><text x="789.3" y="568" font-family="Inter" font-size="11.5" font-weight="500" fill="#6B7280" text-anchor="end">prontuário</text><rect x="562.7" y="576" width="226.7" height="40" rx="8" fill="#F3F4F6" stroke="#8A93A1" stroke-width="1"/><text x="574.7" y="601" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Não informado</text><g id="campo_teste_cognitivo"><text x="805.3" y="568" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Teste cognitivo</text><rect x="805.3" y="576" width="226.7" height="40" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/><text x="817.3" y="601" font-family="Inter" font-size="14" font-weight="400" fill="#111827">MMSE 22 (28/10/2026)</text></g></g><g id="secao_volumetria"><rect x="296" y="694" width="760" height="128" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="730" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Volumetria</text><text x="1032" y="730" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472" text-anchor="end">do laudo de volumetria</text><g id="campo_icv"><text x="320" y="758" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Volume intracraniano (ICV)</text><rect x="320" y="766" width="226.7" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="332" y="791" font-family="Inter" font-size="14" font-weight="400" fill="#111827">1.200.000</text><text x="534.7" y="791" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472" text-anchor="end">mm³</text></g><text x="562.7" y="758" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Hipocampo</text><rect x="562.7" y="766" width="226.7" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="574.7" y="791" font-family="Inter" font-size="14" font-weight="400" fill="#111827">5.800</text><text x="777.3" y="791" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472" text-anchor="end">mm³</text><text x="805.3" y="758" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Ventrículos laterais</text><rect x="805.3" y="766" width="226.7" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="817.3" y="791" font-family="Inter" font-size="14" font-weight="400" fill="#111827">36.400</text><text x="1020" y="791" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472" text-anchor="end">mm³</text></g><g id="secao_limitacao"><rect x="296" y="838" width="760" height="132" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="874" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Limitação observada (opcional)</text><rect x="320" y="892" width="712" height="56" rx="8" fill="#F0F4FF" stroke="#C7D0FB" stroke-width="1"/><text x="336" y="916" font-family="Inter" font-size="14" font-weight="600" fill="#111827">Movimento na sequência T2 axial — leitura possível com ressalva</text><text x="336" y="936" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">Acompanhará o estudo até quem lauda</text></g><g id="painel_pendencias"><rect x="1080" y="176" width="312" height="299" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><rect x="1080" y="176" width="312" height="4" fill="#15803D"/><text x="1104" y="214" font-family="Inter" font-size="16" font-weight="700" fill="#111827">Nenhuma pendência</text><circle cx="1116" cy="254" r="9" fill="#15803D"/><path d="M1111.95,254 L1115.1,256.97 L1120.5,250.58" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1134" y="259" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">Exame completo. Pode enviar para</text><text x="1134" y="279" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">análise e, depois do resultado,</text><text x="1134" y="299" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">liberar a paciente.</text><text x="1104" y="329" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">Ao enviar, a análise do modelo leva cerca</text><text x="1104" y="347" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">de 3 minutos.</text><g id="btn_enviar_analise"><rect x="1104" y="367" width="264" height="44" rx="8" fill="#3346D3"/><text x="1236" y="394" font-family="Inter" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Enviar para análise</text></g><g id="btn_cancelar_envio"><rect x="1104" y="419" width="264" height="36" rx="8" fill="none"/><text x="1236" y="442" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3" text-anchor="middle">Cancelar o envio</text></g></g></svg>