" font-size="12.5" font-weight="500" fill="#5B6472">Data de nascimento</text><text x="320" y="326" font-family="Inter" font-size="16" font-weight="600" fill="#C81E1E">12/03/1952</text><circle cx="796" cy="320" r="8" fill="#C81E1E"/><path d="M792.96,316.96 L799.04,323.04 M799.04,316.96 L792.96,323.04" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="352" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Código do paciente</text><text x="320" y="376" font-family="Inter" font-size="16" font-weight="600" fill="#111827">PAC-0031</text><rect x="856" y="176" width="536" height="230" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="880" y="212" font-family="Inter" font-size="15" font-weight="600" fill="#111827">No prontuário</text><text x="880" y="252" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Nome</text><text x="880" y="276" font-family="Inter" font-size="16" font-weight="600" fill="#111827">Aparecida Souza</text><text x="880" y="302" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Data de nascimento</text><text x="880" y="326" font-family="Inter" font-size="16" font-weight="600" fill="#C81E1E">21/03/1952</text><circle cx="1356" cy="320" r="8" fill="#C81E1E"/><path d="M1352.96,316.96 L1359.04,323.04 M1359.04,316.96 L1352.96,323.04" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="880" y="352" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Código do paciente</text><text x="880" y="376" font-family="Inter" font-size="16" font-weight="600" fill="#111827">PAC-0031</text></g><g id="aviso_identidade_nao_confere"><rect x="296" y="430" width="1096" height="66" rx="10" fill="#FEF3F2" stroke="#FECDCA" stroke-width="1"/><circle cx="318" cy="454" r="9" fill="#C81E1E"/><path d="M314.58,450.58 L321.42,457.42 M321.42,450.58 L314.58,457.42" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="338" y="459" font-family="Inter" font-size="14" font-weight="600" fill="#C81E1E">Envio bloqueado: a data de nascimento não confere</text><text x="338" y="482" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">Corrija o cadastro no prontuário (a correção é feita fora deste sistema) e confira a identidade de novo. Até lá, o exame não pode ser enviado.</text></g><g id="btn_conferir_de_novo"><rect x="296" y="516" width="149.8" height="44" rx="8" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1"/><text x="370.9" y="543" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Conferir de novo</text></g></svg>