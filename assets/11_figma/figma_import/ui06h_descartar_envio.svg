roke="#8A93A1" stroke-width="1"/><text x="574.7" y="601" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Não informado</text><g id="campo_teste_cognitivo"><text x="805.3" y="568" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Teste cognitivo</text><rect x="805.3" y="576" width="226.7" height="40" rx="8" fill="#FFFFFF" stroke="#C81E1E" stroke-width="1.5"/><text x="817.3" y="601" font-family="Inter" font-size="14" font-weight="400" fill="#6B7280">Não consta na requisição</text><circle cx="812.3" cy="631" r="7" fill="#C81E1E"/><path d="M809.6733333333333,628.34 L814.9933333333332,633.66 M814.9933333333332,628.34 L809.6733333333333,633.66" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="825.3" y="636" font-family="Inter" font-size="12.5" font-weight="500" fill="#C81E1E">Pendência obrigatória</text></g></g><g id="secao_volumetria"><rect x="296" y="694" width="760" height="128" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="730" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Volumetria</text><text x="1032" y="730" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472" text-anchor="end">do laudo de volumetria</text><g id="campo_icv"><text x="320" y="758" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Volume intracraniano (ICV)</text><rect x="320" y="766" width="226.7" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="332" y="791" font-family="Inter" font-size="14" font-weight="400" fill="#111827">1.200.000</text><text x="534.7" y="791" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472" text-anchor="end">mm³</text></g><text x="562.7" y="758" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Hipocampo</text><rect x="562.7" y="766" width="226.7" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="574.7" y="791" font-family="Inter" font-size="14" font-weight="400" fill="#111827">5.800</text><text x="777.3" y="791" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472" text-anchor="end">mm³</text><text x="805.3" y="758" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Ventrículos laterais</text><rect x="805.3" y="766" width="226.7" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="817.3" y="791" font-family="Inter" font-size="14" font-weight="400" fill="#111827">36.400</text><text x="1020" y="791" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472" text-anchor="end">mm³</text></g><g id="secao_limitacao"><rect x="296" y="838" width="760" height="112" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="874" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Limitação observada (opcional)</text><text x="320" y="900" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472">Se você aceitar uma imagem com limitação, registre aqui. A limitação acompanha o estudo até quem lauda.</text><g id="btn_registrar_limitacao"><rect x="320" y="912" width="162.4" height="32" rx="8" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1"/><text x="401.2" y="933" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Registrar limitação</text></g></g><g id="painel_pendencias"><rect x="1080" y="176" width="312" height="314" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><rect x="1080" y="176" width="312" height="4" fill="#B45309"/><text x="1104" y="214" font-family="Inter" font-size="16" font-weight="700" fill="#111827">Pendências obrigatórias</text><rect x="1336" y="198" width="25.1" height="22" rx="11" fill="#FFFAEB"/><text x="1346" y="213" font-family="Inter" font-size="12" font-weight="600" fill="#B45309">1</text><rect x="1104" y="240" width="264" height="44" rx="8" fill="#FFFAEB"/><path d="M1124,253 L1134,270 L1114,270 Z" fill="#B45309" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1124,259 L1124,264" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1124" cy="267" r="1.2" fill="#fff"/><text x="1142" y="267" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Teste cognitivo não consta na</text><text x="1142" y="285" font-family="Inter" font-size="13" font-weight="500" fill="#111827">requisição</text><text x="1104" y="308" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">O envio fica bloqueado até resolver. A</text><text x="1104" y="326" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">interface aponta; o que fazer com cada</text><text x="1104" y="344" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">pendência é decisão sua e, quando o</text><text x="1104" y="362" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">protocolo exigir, do radiologista.</text><g id="btn_enviar_analise"><rect x="1104" y="382" width="264" height="44" rx="8" fill="#E7EAF0"/><text x="1236" y="409" font-family="Inter" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">Enviar para análise</text></g><g id="btn_cancelar_envio"><rect x="1104" y="434" width="264" height="36" rx="8" fill="none"/><text x="1236" y="457" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3" text-anchor="middle">Cancelar o envio</text></g></g><rect x="0" y="0" width="1440" height="998" fill="#0B1220" fill-opacity="0.45"/><g id="dialogo_descartar_envio"><rect x="470" y="300" width="500" height="250" rx="14" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="502" y="350" font-family="Inter" font-size="20" font-weight="700" fill="#111827">Descartar o envio?</text><text x="502" y="386" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Os dados preenchidos e a limitação registrada serão perdidos. O</text><text x="502" y="407" font-family="Inter" font-size="14" font-weight="400" fill="#111827">exame continua no PACS; só este envio é descartado.</text><g id="btn_descartar"><rect x="818" y="480" width="120" height="40" rx="8" fill="#C81E1E"/><text x="878" y="505" font-family="Inter" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Descartar</text></g><g id="btn_continuar"><rect x="606" y="480" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1"/><text x="706" y="505" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Continuar a conferência</text></g></g></svg>