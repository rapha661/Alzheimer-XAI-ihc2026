y1="276" x2="336" y2="320" stroke="#ABEFC6" stroke-width="2"/><text x="360" y="268" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Exame recebido</text><text x="360" y="290" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472">9h31</text><circle cx="336" cy="333" r="9" fill="#15803D"/><path d="M331.95,333 L335.1,335.97 L340.5,329.58" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="336" y1="346" x2="336" y2="390" stroke="#ABEFC6" stroke-width="2"/><text x="360" y="338" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Série e dados conferidos</text><text x="360" y="360" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472">T1 volumétrica, cobertura e pendências resolvidas</text><circle cx="336" cy="403" r="9" fill="none" stroke="#D6DBF7" stroke-width="3"/><path d="M336,394 A9,9 0 0 1 345,403" fill="none" stroke="#3346D3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="408" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Análise do modelo</text><text x="360" y="430" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472">em andamento · cerca de 3 minutos</text><rect x="360" y="444" width="668" height="6" rx="3" fill="#E4E7F7"/><rect x="360" y="444" width="267.2" height="6" rx="3" fill="#3346D3"/><text x="324" y="492" font-family="Inter" font-size="13.5" font-weight="500" fill="#111827">Se possível, aguarde o resultado antes de liberar a paciente: se a análise falhar por causa da imagem, a</text><text x="324" y="512" font-family="Inter" font-size="13.5" font-weight="500" fill="#111827">sequência ainda pode ser repetida.</text><text x="296" y="588" font-family="Inter" font-size="13.5" font-weight="400" fill="#5B6472">Você pode sair desta tela. O resultado aparece para o médico solicitante quando a análise terminar.</text><g id="btn_enviar_outro"><rect x="296" y="620" width="166.8" height="42" rx="8" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1"/><text x="379.4" y="646" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Enviar outro exame</text></g></svg>