<text x="324.0" y="470.0" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#111827" text-anchor="start">Se possível, aguarde o resultado antes de liberar a paciente: se a análise falhar por causa da imagem, a</text>
