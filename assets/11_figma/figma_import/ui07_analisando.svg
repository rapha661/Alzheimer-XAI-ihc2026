<text x="296.0" y="556.0" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6472" text-anchor="start">Você pode sair desta tela. O resultado aparece em Casos e o médico solicitante é avisado quando a análise terminar.</text>
