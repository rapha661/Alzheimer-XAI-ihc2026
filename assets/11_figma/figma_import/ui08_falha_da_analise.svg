<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>UI08 — Tratar a falha da análise</title><rect x="0" y="0" width="1440" height="900" fill="#F6F7F9"/><g id="barra_lateral"><rect x="0" y="0" width="248" height="900" fill="#FBFBFC"/><line x1="248" y1="0" x2="248" y2="900" stroke="#E3E6EC" stroke-width="1"/><rect x="24" y="22" width="34" height="34" rx="8" fill="#3346D3"/><text x="41" y="45" font-family="Inter" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">M</text><text x="68" y="37" font-family="Inter" font-size="15" font-weight="700" fill="#111827">M-XAI</text><text x="68" y="53" font-family="Inter" font-size="11.5" font-weight="400" fill="#5B6472">Apoio à investigação cognitiva</text><g id="menu_novo"><rect x="16" y="96" width="216" height="38" rx="8" fill="#EDEFF3"/><rect x="16" y="104" width="3" height="22" rx="1.5" fill="#3346D3"/><rect x="34" y="108" width="16" height="14" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/><text x="64" y="120" font-family="Inter" font-size="14" font-weight="600" fill="#111827">Novo exame</text></g><line x1="16" y1="804" x2="232" y2="804" stroke="#E3E6EC" stroke-width="1"/><g id="usuario_logado"><circle cx="42" cy="842" r="18" fill="#EEF0FD"/><text x="42" y="847" font-family="Inter" font-size="12.5" font-weight="700" fill="#3346D3" text-anchor="middle">BT</text><text x="70" y="837" font-family="Inter" font-size="13.5" font-weight="600" fill="#111827">Bruno Tavares Lima</text><text x="70" y="855" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">Técnico em radiologia</text></g><g id="link_sair"><text x="70" y="880" font-family="Inter" font-size="12.5" font-weight="600" fill="#3346D3">Sair</text></g></g><text x="296" y="64" font-family="Inter" font-size="28" font-weight="700" fill="#111827">Análise não concluída</text><text x="296" y="92" font-family="Inter" font-size="14" font-weight="400" fill="#5B6472">Aparecida Souza  ·  PAC-0031  ·  74 anos  ·  pedido de 16/11/2026</text><g id="etapas_do_envio"><rect x="296" y="116" width="106.6" height="34" rx="17" fill="#ECFDF3"/><circle cx="314" cy="133" r="8" fill="#15803D"/><path d="M310.4,133 L313.2,135.64 L318,129.96" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#15803D">Preparar</text><rect x="410.6" y="116" width="185.2" height="34" rx="17" fill="#ECFDF3"/><circle cx="428.6" cy="133" r="8" fill="#15803D"/><path d="M424.98699999999997,133 L427.787,135.64 L432.587,129.96" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="444.6" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#15803D">Confirmar identidade</text><rect x="603.8" y="116" width="204.8" height="34" rx="17" fill="#ECFDF3"/><circle cx="621.8" cy="133" r="8" fill="#15803D"/><path d="M618.185,133 L620.985,135.64 L625.785,129.96" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="637.8" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#15803D">Conferir antes de liberar</text><rect x="816.5" y="116" width="191.3" height="34" rx="17" fill="#EEF0FD"/><circle cx="834.5" cy="133" r="9" fill="#3346D3"/><text x="834.5" y="137" font-family="Inter" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="850.5" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#3346D3">Acompanhar a análise</text></g><rect x="296" y="176" width="760" height="470" rx="12" fill="#FFFFFF" stroke="#FECDCA" stroke-width="1"/><rect x="296" y="176" width="760" height="4" fill="#C81E1E"/><circle cx="334" cy="220" r="11" fill="#C81E1E"/><path d="M329.82,215.82 L338.18,224.18 M338.18,215.82 L329.82,224.18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="356" y="226" font-family="Inter" font-size="19" font-weight="700" fill="#111827">A análise não pôde ser concluída</text><rect x="892" y="210" width="125" height="22" rx="11" fill="#FFFAEB"/><text x="902" y="225" font-family="Inter" font-size="12" font-weight="600" fill="#B45309">Reenvio pendente</text><text x="324" y="272" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">Motivo da falha</text><text x="324" y="296" font-family="Inter" font-size="15" font-weight="400" fill="#111827">O modelo não conseguiu medir o hipocampo nesta imagem: a série T1 tem artefato de movimento</text><text x="324" y="318" font-family="Inter" font-size="15" font-weight="400" fill="#111827">na região temporal.</text><text x="324" y="358" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">O que fazer</text><text x="324" y="382" font-family="Inter" font-size="15" font-weight="400" fill="#111827">Se a paciente ainda estiver no setor, repita a sequência T1 volumétrica e reenvie o exame.</text><text x="324" y="412" font-family="Inter" font-size="15" font-weight="400" fill="#111827">Se ela já foi liberada, a nova aquisição depende de reconvocação, que é feita fora deste sistema.</text><text x="324" y="434" font-family="Inter" font-size="15" font-weight="400" fill="#111827">Antes, verifique se o exame tem outra série T1 utilizável.</text><text x="324" y="468" font-family="Inter" font-size="13.5" font-weight="500" fill="#15803D">Os dados clínicos, a volumetria e a limitação registrada foram mantidos: no reenvio, você troca só o arquivo.</text><g id="btn_reenviar_exame"><rect x="324" y="572" width="144.4" height="44" rx="8" fill="#3346D3"/><text x="396.2" y="599" font-family="Inter" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Reenviar exame</text></g><g id="btn_enviar_outro"><rect x="480.4" y="572" width="166.8" height="44" rx="8" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1"/><text x="563.8" y="599" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Enviar outro exame</text></g></svg>