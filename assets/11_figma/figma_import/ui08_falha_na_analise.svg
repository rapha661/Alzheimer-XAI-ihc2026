<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900">
<title>UI08 — Falha na análise</title>
<rect x="0.0" y="0.0" width="1440.0" height="900.0" rx="0" fill="#F6F7F9"/>
<g id="barra_lateral">
<rect x="0.0" y="0.0" width="248.0" height="900.0" rx="0" fill="#FBFBFC"/>
