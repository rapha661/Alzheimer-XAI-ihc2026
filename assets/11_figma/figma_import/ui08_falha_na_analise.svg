<rect x="24.0" y="22.0" width="34.0" height="34.0" rx="8" fill="#3346D3"/>
<text x="41.0" y="45.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">M</text>
<text x="68.0" y="37.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="start">M-XAI</text>
<text x="68.0" y="53.0" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5B6472" text-anchor="start">Alzheimer explicável</text>
