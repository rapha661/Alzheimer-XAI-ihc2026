<rect x="16.0" y="80.0" width="216.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/>
<circle cx="38" cy="99" r="6" fill="none" stroke="#6B7280" stroke-width="1.6"/>
<path d="M42.5,103.5 L47,108" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56.0" y="105.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Buscar paciente…</text>
</g>
<g id="menu_casos">
<rect x="16.0" y="144.0" width="216.0" height="38.0" rx="8" fill="#EDEFF3"/>
<rect x="16.0" y="152.0" width="3.0" height="22.0" rx="1.5" fill="#3346D3"/>
<path d="M36,157 L42,157 L44,159 L52,159 L52,171 L36,171 Z" fill="none" stroke="#111827" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64.0" y="168.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="start">Casos</text>
</g>
<g id="menu_novo">
<circle cx="44" cy="209" r="8" fill="none" stroke="#5B6472" stroke-width="1.5"/>
<path d="M44,205 L44,213 M40,209 L48,209" fill="none" stroke="#5B6472" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64.0" y="214.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6472" text-anchor="start">Novo caso</text>
</g>
<line x1="16" y1="816" x2="232" y2="816" stroke="#E3E6EC" stroke-width="1"/>
<g id="usuario_logado">
<circle cx="42" cy="858" r="18" fill="#EEF0FD"/>
<text x="42.0" y="863.0" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#3346D3" text-anchor="middle">BT</text>
<text x="70.0" y="853.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="start">Bruno Tavares Lima</text>
<text x="70.0" y="871.0" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6472" text-anchor="start">Técnico em radiologia</text>
</g>
</g>
<g id="link_voltar_casos">
<path d="M306,40 L296,40 M301,35 L296,40 L301,45" fill="none" stroke="#5B6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="314.0" y="44.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6472" text-anchor="start">Casos</text>
</g>
<text x="296.0" y="92.0" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="start">Aparecida Souza</text>
<rect x="542.3" y="72.0" width="124.6" height="22.0" rx="11" fill="#FFFAEB"/>
<text x="552.3" y="87.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#B45309" text-anchor="start">Reenvio pendente</text>
<text x="296.0" y="122.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6472" text-anchor="start">PAC-0031  ·  74 anos  ·  feminino  ·  RM em 14/11/2026</text>
<rect x="296.0" y="156.0" width="760.0" height="440.0" rx="12" fill="#FFFFFF" stroke="#FECDCA" stroke-width="1"/>
<path d="M296,168 A12,12 0 0 1 308,156 L1044,156 A12,12 0 0 1 1056,168 L1056,160 L296,160 Z" fill="#C81E1E"/>
<circle cx="334" cy="200" r="11" fill="#C81E1E"/>
<path d="M330.5,196.5 L337.5,203.5 M337.5,196.5 L330.5,203.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="356.0" y="206.0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="start">A análise não pôde ser concluída</text>
<text x="324.0" y="252.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#5B6472" text-anchor="start">O que aconteceu</text>
<text x="324.0" y="276.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#111827" text-anchor="start">O modelo não conseguiu medir o hipocampo nesta imagem: a série T1 tem artefato de movimento</text>
<text x="324.0" y="298.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#111827" text-anchor="start">na região temporal.</text>
<text x="324.0" y="338.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#5B6472" text-anchor="start">O que fazer</text>
<text x="324.0" y="362.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#111827" text-anchor="start">Se a paciente ainda estiver no setor, repita a sequência T1 volumétrica e reenvie o exame.</text>
<text x="324.0" y="392.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#111827" text-anchor="start">Se ela já foi liberada, verifique se o exame tem outra série T1 utilizável antes de reconvocar.</text>
<text x="324.0" y="426.0" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6472" text-anchor="start">Os dados da paciente, os dados enviados ao modelo e o contexto clínico ficam guardados: no reenvio você</text>
<text x="324.0" y="446.0" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6472" text-anchor="start">troca só o arquivo.</text>
<g id="btn_reenviar_exame">
<rect x="324.0" y="516.0" width="143.8" height="44.0" rx="8" fill="#3346D3"/>
<text x="395.9" y="543.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Reenviar exame</text>
</g>
<g id="btn_voltar_casos">
<rect x="479.8" y="516.0" width="148.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/>
<text x="553.8" y="543.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Voltar aos casos</text>
</g>
<g id="link_detalhes_tecnicos">
<text x="1028.0" y="544.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#3346D3" text-anchor="end">Detalhes técnicos (para o suporte)  ▸</text>
</g>
</svg>
