s</text></g><text x="296" y="92" font-family="Inter" font-size="28" font-weight="700" fill="#111827">Ivo Bittencourt</text><rect x="511.9" y="72" width="78.9" height="22" rx="11" fill="#ECFDF3"/><text x="521.9" y="87" font-family="Inter" font-size="12" font-weight="600" fill="#15803D">Concluído</text><text x="296" y="122" font-family="Inter" font-size="14" font-weight="400" fill="#5B6472">PAC-0012  ·  71 anos  ·  masculino  ·  RM em 12/11/2026</text><g id="abas_do_caso"><g id="aba_evidencias"><text x="312" y="164" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Evidências do caso</text></g><g id="aba_sugestao"><text x="478.2" y="164" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Sugestão do modelo</text></g><g id="aba_decisao"><text x="652.7" y="164" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3">Decisão</text><rect x="636.7" y="178" width="86.5" height="3" fill="#3346D3"/></g><line x1="296" y1="181" x2="1392" y2="181" stroke="#E3E6EC" stroke-width="1"/></g><g id="card_decisao_registrada"><rect x="296" y="209" width="1096" height="351" rx="12" fill="#FFFFFF" stroke="#ABEFC6" stroke-width="1"/><rect x="297" y="210" width="1094" height="62" rx="11" fill="#ECFDF3"/><rect x="297" y="259" width="1094" height="13" fill="#ECFDF3"/><circle cx="330" cy="240" r="9" fill="#15803D"/><path d="M325.95,240 L329.1,242.97 L334.5,236.58" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="348" y="245" font-family="Inter" font-size="17" font-weight="700" fill="#111827">Decisão registrada</text><text x="518.4" y="245" font-family="Inter" font-size="13.5" font-weight="400" fill="#5B6472">Marcos Andrade · Médico clínico · 13/11/2026 às 10:42</text><line x1="296" y1="272" x2="1392" y2="272" stroke="#ABEFC6" stroke-width="1"/><text x="320" y="303" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Em relação à sugestão</text><text x="320" y="327" font-family="Inter" font-size="16" font-weight="600" fill="#111827">Concordo parcialmente</text><text x="661.3" y="303" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Conclusão</text><text x="661.3" y="327" font-family="Inter" font-size="16" font-weight="600" fill="#111827">Inconclusivo: encaminhar a especialista</text><text x="320" y="363" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Conduta</text><text x="320" y="387" font-family="Inter" font-size="14.5" font-weight="400" fill="#111827">Reencaminhar ao Dr. César com o parecer de 29/08 e a queda do MMSE; antecipar a reavaliação prevista para fevereiro.</text><text x="320" y="423" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Evidências consideradas</text><rect x="320" y="433" width="231.9" height="22" rx="11" fill="#EEF0F3"/><text x="330" y="448" font-family="Inter" font-size="12" font-weight="600" fill="#5B6472">Parecer de Neurologia (29/08/2026)</text><rect x="559.9" y="433" width="108" height="22" rx="11" fill="#EEF0F3"/><text x="569.9" y="448" font-family="Inter" font-size="12" font-weight="600" fill="#5B6472">MMSE 26 → 23</text><rect x="675.9" y="433" width="252.6" height="22" rx="11" fill="#EEF0F3"/><text x="685.9" y="448" font-family="Inter" font-size="12" font-weight="600" fill="#5B6472">Sugestão do modelo (RM de 12/11/2026)</text><text x="320" y="483" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Justificativa</text><text x="320" y="507" font-family="Inter" font-size="14" font-weight="400" fill="#111827">O MMSE caiu de 26 para 23 em menos de três meses. O parecer de 29/08 afastou Alzheimer com base em critérios que essa queda pode ter mudado, e a</text><text x="320" y="528" font-family="Inter" font-size="14" font-weight="400" fill="#111827">sugestão aponta Alzheimer com confiabilidade moderada. Antecipo a reavaliação com o especialista.</text><text x="320" y="544" font-family="Inter" font-size="12.5" font-weight="600" fill="#3346D3">Ligada ao parecer de Neurologia de 29/08/2026</text></g><g id="historico_do_caso"><rect x="296" y="584" width="1096" height="150" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="618" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Raciocínio registrado neste caso, em ordem</text><circle cx="328" cy="650" r="5" fill="#3346D3"/><text x="344" y="655" font-family="Inter" font-size="13.5" font-weight="600" fill="#111827">29/08/2026</text><text x="446" y="655" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">Parecer de Neurologia — Dr. César Andrade de Melo, por telefone</text><circle cx="328" cy="684" r="5" fill="#3346D3"/><text x="344" y="689" font-family="Inter" font-size="13.5" font-weight="600" fill="#111827">13/11/2026</text><text x="446" y="689" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">Decisão — Marcos Andrade, ligada ao parecer</text></g><g id="link_voltar_aos_casos"><text x="296" y="774" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3">←  Voltar aos casos</text></g><g id="aviso_temporario"><rect x="1144.3" y="24" width="247.7" height="48" rx="10" fill="#111827"/><circle cx="1168.3" cy="48" r="9" fill="#15803D"/><path d="M1164.266,48 L1167.416,50.97 L1172.816,44.58" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1186.3" y="53" font-family="Inter" font-size="14" font-weight="600" fill="#fff">Decisão registrada às 10:42</text></g></svg>