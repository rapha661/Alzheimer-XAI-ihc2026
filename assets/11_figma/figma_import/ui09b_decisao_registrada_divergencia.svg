<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="902" viewBox="0 0 1440 902"><title>UI09b — Decisão registrada com divergência</title><rect x="0" y="0" width="1440" height="902" fill="#F6F7F9"/><g id="barra_lateral"><rect x="0" y="0" width="248" height="902" fill="#FBFBFC"/><line x1="248" y1="0" x2="248" y2="902" stroke="#E3E6EC" stroke-width="1"/><rect x="24" y="22" width="34" height="34" rx="8" fill="#3346D3"/><text x="41" y="45" font-family="Inter" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">M</text><text x="68" y="37" font-family="Inter" font-size="15" font-weight="700" fill="#111827">M-XAI</text><text x="68" y="53" font-family="Inter" font-size="11.5" font-weight="400" fill="#5B6472">Apoio à investigação cognitiva</text><g id="menu_casos"><rect x="16" y="96" width="216" height="38" rx="8" fill="#EDEFF3"/><rect x="16" y="104" width="3" height="22" rx="1.5" fill="#3346D3"/><rect x="34" y="108" width="16" height="14" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/><text x="64" y="120" font-family="Inter" font-size="14" font-weight="600" fill="#111827">Casos</text></g><line x1="16" y1="806" x2="232" y2="806" stroke="#E3E6EC" stroke-width="1"/><g id="usuario_logado"><circle cx="42" cy="844" r="18" fill="#EEF0FD"/><text x="42" y="849" font-family="Inter" font-size="12.5" font-weight="700" fill="#3346D3" text-anchor="middle">CM</text><text x="70" y="839" font-family="Inter" font-size="13.5" font-weight="600" fill="#111827">César Andrade de Melo</text><text x="70" y="857" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">Neurologista</text></g><g id="link_sair"><text x="70" y="882" font-family="Inter" font-size="12.5" font-weight="600" fill="#3346D3">Sair</text></g></g><g id="link_voltar_casos"><path d="M306,40 L296,40 M301,35 L296,40 L301,45" fill="none" stroke="#5B6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="314" y="44" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Casos</text></g><text x="296" y="92" font-family="Inter" font-size="28" font-weight="700" fill="#111827">Roberto Mendes</text><rect x="535.6" y="72" width="78.9" height="22" rx="11" fill="#ECFDF3"/><text x="545.6" y="87" font-family="Inter" font-size="12" font-weight="600" fill="#15803D">Concluído</text><text x="296" y="122" font-family="Inter" font-size="14" font-weight="400" fill="#5B6472">PAC-0027  ·  76 anos  ·  masculino  ·  RM em 05/06/2026</text><g id="abas_do_caso"><g id="aba_evidencias"><text x="312" y="164" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Evidências do caso</text></g><g id="aba_sugestao"><text x="478.2" y="164" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Sugestão do modelo</text></g><g id="aba_decisao"><text x="652.7" y="164" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3">Decisão</text><rect x="636.7" y="178" width="86.5" height="3" fill="#3346D3"/></g><line x1="296" y1="181" x2="1392" y2="181" stroke="#E3E6EC" stroke-width="1"/></g><g id="card_decisao_registrada"><rect x="296" y="209" width="1096" height="421" rx="12" fill="#FFFFFF" stroke="#ABEFC6" stroke-width="1"/><rect x="297" y="210" width="1094" height="62" rx="11" fill="#ECFDF3"/><rect x="297" y="259" width="1094" height="13" fill="#ECFDF3"/><circle cx="330" cy="240" r="9" fill="#15803D"/><path d="M325.95,240 L329.1,242.97 L334.5,236.58" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="348" y="245" font-family="Inter" font-size="17" font-weight="700" fill="#111827">Decisão registrada</text><text x="518.4" y="245" font-family="Inter" font-size="13.5" font-weight="400" fill="#5B6472">César Andrade de Melo · Neurologista · 13/11/2026 às 15:20</text><line x1="296" y1="272" x2="1392" y2="272" stroke="#ABEFC6" stroke-width="1"/><text x="320" y="303" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Em relação à sugestão</text><text x="320" y="327" font-family="Inter" font-size="16" font-weight="600" fill="#111827">Concordo</text><text x="661.3" y="303" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Conclusão</text><text x="661.3" y="327" font-family="Inter" font-size="16" font-weight="600" fill="#111827">Compatível com Alzheimer</text><text x="320" y="363" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Conduta</text><text x="320" y="387" font-family="Inter" font-size="14.5" font-weight="400" fill="#111827">Solicitar avaliação neuropsicológica antes de parecer sobre direção; orientar a família a acompanhar os deslocamentos.</text><text x="320" y="423" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Evidências consideradas</text><rect x="320" y="433" width="257" height="22" rx="11" fill="#EEF0F3"/><text x="330" y="448" font-family="Inter" font-size="12" font-weight="600" fill="#5B6472">Episódios relatados (20/10 e 02/11/2026)</text><rect x="585" y="433" width="197.8" height="22" rx="11" fill="#EEF0F3"/><text x="595" y="448" font-family="Inter" font-size="12" font-weight="600" fill="#5B6472">MMSE 27 (02/06 e 13/11/2026)</text><rect x="790.8" y="433" width="178" height="22" rx="11" fill="#EEF0F3"/><text x="800.8" y="448" font-family="Inter" font-size="12" font-weight="600" fill="#5B6472">Laudo de RM (05/06/2026)</text><rect x="976.8" y="433" width="260.9" height="22" rx="11" fill="#EEF0F3"/><text x="986.8" y="448" font-family="Inter" font-size="12" font-weight="600" fill="#5B6472">Sugestão do modelo (RM de 05/06/2026)</text><text x="320" y="483" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Divergência registrada</text><text x="320" y="507" font-family="Inter" font-size="14.5" font-weight="400" fill="#111827">Escores estáveis (MMSE 27 em junho e em novembro) × episódios recentes relatados pela filha.</text><text x="320" y="553" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Justificativa</text><text x="320" y="577" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Concordo com o padrão sugerido apesar da confiabilidade baixa porque os episódios de desorientação e os lapsos com contas, posteriores ao teste de</text><text x="320" y="598" font-family="Inter" font-size="14" font-weight="400" fill="#111827">junho, apontam no mesmo sentido. A sugestão não responde sobre direção; essa decisão depende da avaliação neuropsicológica.</text><text x="320" y="614" font-family="Inter" font-size="12.5" font-weight="600" fill="#3346D3">A divergência aparecerá entre as evidências no próximo retorno</text></g><g id="historico_do_caso"><rect x="296" y="654" width="1096" height="120" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="688" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Raciocínio registrado neste caso, em ordem</text><circle cx="328" cy="720" r="5" fill="#3346D3"/><text x="344" y="725" font-family="Inter" font-size="13.5" font-weight="600" fill="#111827">13/11/2026</text><text x="446" y="725" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">Decisão — César Andrade de Melo, com a divergência registrada</text></g><g id="link_voltar_aos_casos"><text x="296" y="814" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3">←  Voltar aos casos</text></g><g id="aviso_temporario"><rect x="1144.8" y="24" width="247.2" height="48" rx="10" fill="#111827"/><circle cx="1168.8" cy="48" r="9" fill="#15803D"/><path d="M1164.784,48 L1167.934,50.97 L1173.334,44.58" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1186.8" y="53" font-family="Inter" font-size="14" font-weight="600" fill="#fff">Decisão registrada às 15:20</text></g></svg>