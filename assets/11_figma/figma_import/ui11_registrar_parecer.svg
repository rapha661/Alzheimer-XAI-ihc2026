<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>UI11 — Registrar parecer de especialista</title><rect x="0" y="0" width="1440" height="900" fill="#F6F7F9"/><g id="barra_lateral"><rect x="0" y="0" width="248" height="900" fill="#FBFBFC"/><line x1="248" y1="0" x2="248" y2="900" stroke="#E3E6EC" stroke-width="1"/><rect x="24" y="22" width="34" height="34" rx="8" fill="#3346D3"/><text x="41" y="45" font-family="Inter" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">M</text><text x="68" y="37" font-family="Inter" font-size="15" font-weight="700" fill="#111827">M-XAI</text><text x="68" y="53" font-family="Inter" font-size="11.5" font-weight="400" fill="#5B6472">Apoio à investigação cognitiva</text><g id="menu_casos"><rect x="16" y="96" width="216" height="38" rx="8" fill="#EDEFF3"/><rect x="16" y="104" width="3" height="22" rx="1.5" fill="#3346D3"/><rect x="34" y="108" width="16" height="14" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/><text x="64" y="120" font-family="Inter" font-size="14" font-weight="600" fill="#111827">Casos</text></g><line x1="16" y1="804" x2="232" y2="804" stroke="#E3E6EC" stroke-width="1"/><g id="usuario_logado"><circle cx="42" cy="842" r="18" fill="#EEF0FD"/><text x="42" y="847" font-family="Inter" font-size="12.5" font-weight="700" fill="#3346D3" text-anchor="middle">MA</text><text x="70" y="837" font-family="Inter" font-size="13.5" font-weight="600" fill="#111827">Marcos Andrade</text><text x="70" y="855" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">Médico clínico</text></g><g id="link_sair"><text x="70" y="880" font-family="Inter" font-size="12.5" font-weight="600" fill="#3346D3">Sair</text></g></g><g id="link_voltar_casos"><path d="M306,40 L296,40 M301,35 L296,40 L301,45" fill="none" stroke="#5B6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="314" y="44" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Casos</text></g><text x="296" y="92" font-family="Inter" font-size="28" font-weight="700" fill="#111827">Ivo Bittencourt</text><rect x="511.9" y="72" width="137.6" height="22" rx="11" fill="#EEF0FD"/><text x="521.9" y="87" font-family="Inter" font-size="12" font-weight="600" fill="#3346D3">Aguardando revisão</text><text x="296" y="122" font-family="Inter" font-size="14" font-weight="400" fill="#5B6472">PAC-0012  ·  71 anos  ·  masculino  ·  RM em 12/11/2026</text><g id="btn_registrar_decisao"><rect x="1237.8" y="64" width="154.2" height="44" rx="8" fill="#3346D3"/><text x="1314.9" y="91" font-family="Inter" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Registrar decisão</text></g><g id="abas_do_caso"><g id="aba_evidencias"><text x="312" y="164" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3">Evidências do caso</text><rect x="296" y="178" width="162.2" height="3" fill="#3346D3"/></g><g id="aba_sugestao"><text x="478.2" y="164" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Sugestão do modelo</text></g><g id="aba_decisao"><text x="652.7" y="164" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Decisão</text></g><line x1="296" y1="181" x2="1392" y2="181" stroke="#E3E6EC" stroke-width="1"/></g><g id="card_parecer_de_especialista"><rect x="296" y="209" width="640" height="390" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><rect x="296" y="209" width="640" height="4" fill="#3346D3"/><text x="320" y="249" font-family="Inter" font-size="17" font-weight="700" fill="#111827">Parecer de especialista</text><rect x="525.7" y="233" width="83.6" height="22" rx="11" fill="#EEF0FD"/><text x="535.7" y="248" font-family="Inter" font-size="12" font-weight="600" fill="#3346D3">Neurologia</text><g id="btn_registrar_parecer"><rect x="742" y="229" width="170" height="36" rx="8" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1"/><text x="827" y="252" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Registrar parecer</text></g><text x="320" y="279" font-family="Inter" font-size="14" font-weight="500" fill="#111827">Dr. César Andrade de Melo  ·  29/08/2026  ·  por telefone</text><text x="320" y="301" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">Registrado por Marcos Andrade durante a ligação, separado das anotações de rotina</text><line x1="320" y1="319" x2="912" y2="319" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="349" font-family="Inter" font-size="12.5" font-weight="600" fill="#5B6472">Conclusão</text><text x="320" y="371" font-family="Inter" font-size="14.5" font-weight="600" fill="#111827">Compatível com comprometimento cognitivo leve, sem elementos fortes para</text><text x="320" y="392" font-family="Inter" font-size="14.5" font-weight="600" fill="#111827">Alzheimer neste momento.</text><text x="320" y="424" font-family="Inter" font-size="12.5" font-weight="600" fill="#5B6472">Critérios considerados</text><text x="320" y="446" font-family="Inter" font-size="14.5" font-weight="400" fill="#111827">Redução hipocampal discreta para a idade; MMSE compatível com a escolaridade;</text><text x="320" y="467" font-family="Inter" font-size="14.5" font-weight="400" fill="#111827">autonomia preservada.</text><text x="320" y="499" font-family="Inter" font-size="12.5" font-weight="600" fill="#5B6472">Exames revisados</text><text x="320" y="521" font-family="Inter" font-size="14.5" font-weight="400" fill="#111827">RM de crânio de 15/08/2026 e MMSE de 29/08/2026.</text><text x="320" y="553" font-family="Inter" font-size="12.5" font-weight="600" fill="#5B6472">Recomendação</text><text x="320" y="575" font-family="Inter" font-size="14.5" font-weight="400" fill="#111827">Reavaliar em seis meses (fevereiro de 2027).</text></g><g id="contexto_clinico"><rect x="960" y="209" width="432" height="241" rx="12" fill="#F8FAFC" stroke="#C9D2DF" stroke-width="1" stroke-dasharray="5 4"/><text x="984" y="243" font-family="Inter" font-size="16" font-weight="600" fill="#111827">Contexto clínico</text><text x="984" y="265" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">não entra no cálculo da sugestão</text><rect x="984" y="281" width="186" height="58" rx="8" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="998" y="303" font-family="Inter" font-size="12" font-weight="500" fill="#5B6472">MMSE em 29/08/2026</text><text x="998" y="327" font-family="Inter" font-size="17" font-weight="700" fill="#111827">26 / 30</text><rect x="1182" y="281" width="186" height="58" rx="8" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="1196" y="303" font-family="Inter" font-size="12" font-weight="500" fill="#5B6472">MMSE hoje (13/11/2026)</text><text x="1196" y="327" font-family="Inter" font-size="17" font-weight="700" fill="#C81E1E">23 / 30</text><text x="1368" y="265" font-family="Inter" font-size="12.5" font-weight="700" fill="#C81E1E" text-anchor="end">−3 pontos</text><text x="984" y="375" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Relato do filho (13/11/2026)</text><text x="984" y="397" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Piora perceptível da memória nas últimas semanas:</text><text x="984" y="418" font-family="Inter" font-size="14" font-weight="400" fill="#111827">esquece conversas do mesmo dia e repete perguntas.</text></g><g id="resumo_sugestao"><rect x="960" y="466" width="432" height="120" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="984" y="500" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Sugestão do modelo</text><text x="984" y="526" font-family="Inter" font-size="13.5" font-weight="400" fill="#5B6472">RM de 12/11/2026 analisada</text><g id="link_ver_sugestao"><text x="984" y="556" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3">Ver a sugestão do exame mais recente  →</text></g></g><rect x="0" y="0" width="1440" height="900" fill="#0B1220" fill-opacity="0.38"/><g id="dialogo_registrar_parecer"><rect x="360" y="40" width="720" height="668" rx="14" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="392" y="88" font-family="Inter" font-size="21" font-weight="700" fill="#111827">Registrar parecer de especialista</text><text x="392" y="112" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472">Ivo Bittencourt · PAC-0012 · fica identificado como parecer, separado das anotações de rotina</text><text x="392" y="148" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Especialista</text><rect x="392" y="156" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="404" y="181" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Dr. César Andrade de Melo</text><text x="728" y="148" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Especialidade</text><rect x="728" y="156" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="740" y="181" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Neurologia</text><text x="392" y="226" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Data do parecer</text><rect x="392" y="234" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="404" y="259" font-family="Inter" font-size="14" font-weight="400" fill="#111827">29/08/2026</text><g id="opcoes_canal"><text x="392" y="304" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Canal</text><circle cx="401" cy="331" r="9" fill="#FFFFFF" stroke="#3346D3" stroke-width="1.6"/><circle cx="401" cy="331" r="4.5" fill="#3346D3"/><text x="418" y="336" font-family="Inter" font-size="14" font-weight="600" fill="#111827">Telefone</text><circle cx="517.3" cy="331" r="9" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1.6"/><text x="534.3" y="336" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Presencial</text><circle cx="644.2" cy="331" r="9" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1.6"/><text x="661.2" y="336" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Mensagem</text><circle cx="775.3" cy="331" r="9" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1.6"/><text x="792.3" y="336" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Outro</text></g><g id="campo_conclusao"><text x="392" y="368" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Conclusão</text><rect x="392" y="376" width="656" height="64" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="404" y="400" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Compatível com comprometimento cognitivo leve, sem elementos fortes para Alzheimer neste</text><text x="404" y="420" font-family="Inter" font-size="14" font-weight="400" fill="#111827">momento.</text></g><g id="campo_criterios"><text x="392" y="468" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Critérios considerados</text><rect x="392" y="476" width="656" height="64" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="404" y="500" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Redução hipocampal discreta para a idade; MMSE compatível com a escolaridade; autonomia</text><text x="404" y="520" font-family="Inter" font-size="14" font-weight="400" fill="#111827">preservada.</text></g><text x="392" y="568" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Exames revisados</text><rect x="392" y="576" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="404" y="601" font-family="Inter" font-size="14" font-weight="400" fill="#111827">RM de 15/08/2026; MMSE de 29/08/2026</text><text x="728" y="568" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Recomendação</text><rect x="728" y="576" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="740" y="601" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Reavaliar em 6 meses</text><g id="btn_gravar_parecer"><rect x="898" y="640" width="150" height="40" rx="8" fill="#3346D3"/><text x="973" y="665" font-family="Inter" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Gravar parecer</text></g><g id="btn_cancelar_parecer"><rect x="776" y="640" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1"/><text x="831" y="665" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Cancelar</text></g></g></svg>