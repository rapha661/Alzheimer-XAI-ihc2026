><circle cx="416" cy="299" r="7" fill="#64748B"/><text x="438" y="303" font-family="Inter" font-size="12.5" font-weight="700" fill="#64748B">Teste cognitivo</text><text x="438" y="327" font-family="Inter" font-size="14.5" font-weight="500" fill="#111827">MMSE 27 / 30</text><text x="438" y="347" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Contexto clínico</text><text x="320" y="379" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">05/06/2026</text><circle cx="416" cy="375" r="7" fill="#7C3AED"/><text x="438" y="379" font-family="Inter" font-size="12.5" font-weight="700" fill="#7C3AED">Laudo de RM</text><text x="438" y="403" font-family="Inter" font-size="14.5" font-weight="500" fill="#111827">Alterações limítrofes; redução volumétrica hipocampal discreta.</text><text x="438" y="423" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Radiologia</text><text x="320" y="455" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">05/06/2026</text><circle cx="416" cy="451" r="7" fill="#3346D3"/><text x="438" y="455" font-family="Inter" font-size="12.5" font-weight="700" fill="#3346D3">Sugestão do modelo</text><text x="438" y="479" font-family="Inter" font-size="14.5" font-weight="500" fill="#111827">58% · padrão compatível com Alzheimer · confiabilidade baixa</text><text x="438" y="499" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Usa a RM e os dados enviados ao modelo</text><text x="320" y="531" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">20/10/2026</text><circle cx="416" cy="527" r="7" fill="#C2410C"/><text x="438" y="531" font-family="Inter" font-size="12.5" font-weight="700" fill="#C2410C">Episódio relatado · deslocamento</text><text x="438" y="555" font-family="Inter" font-size="14.5" font-weight="500" fill="#111827">Se perdeu voltando da padaria.</text><text x="438" y="575" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Relatado pela filha</text><text x="320" y="607" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">13/11/2026</text><circle cx="416" cy="603" r="7" fill="#64748B"/><text x="438" y="607" font-family="Inter" font-size="12.5" font-weight="700" fill="#64748B">Teste cognitivo</text><text x="438" y="631" font-family="Inter" font-size="14.5" font-weight="500" fill="#111827">MMSE 27 / 30 (hoje)</text><text x="438" y="651" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Contexto clínico</text><rect x="320" y="669" width="712" height="44" rx="8" fill="#FFFAEB"/><path d="M340,682 L350,699 L330,699 Z" fill="#B45309" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M340,688 L340,693" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="696" r="1.2" fill="#fff"/><text x="358" y="696" font-family="Inter" font-size="13.5" font-weight="500" fill="#111827">Os episódios relatados são posteriores ao teste de junho; o MMSE de hoje continua 27.</text></g><g id="contexto_clinico"><rect x="1080" y="209" width="312" height="241" rx="12" fill="#F8FAFC" stroke="#C9D2DF" stroke-width="1" stroke-dasharray="5 4"/><text x="1104" y="243" font-family="Inter" font-size="16" font-weight="600" fill="#111827">Contexto clínico</text><text x="1104" y="265" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">não entra no cálculo da sugestão</text><rect x="1104" y="281" width="126" height="58" rx="8" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="1118" y="303" font-family="Inter" font-size="12" font-weight="500" fill="#5B6472">MMSE 02/06/2026</text><text x="1118" y="327" font-family="Inter" font-size="17" font-weight="700" fill="#111827">27 / 30</text><rect x="1242" y="281" width="126" height="58" rx="8" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="1256" y="303" font-family="Inter" font-size="12" font-weight="500" fill="#5B6472">MMSE hoje</text><text x="1256" y="327" font-family="Inter" font-size="17" font-weight="700" fill="#111827">27 / 30</text><text x="1104" y="375" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Na consulta</text><text x="1104" y="397" font-family="Inter" font-size="14" font-weight="400" fill="#111827">A filha relata que ele insiste em</text><text x="1104" y="418" font-family="Inter" font-size="14" font-weight="400" fill="#111827">continuar dirigindo.</text></g><g id="resumo_sugestao"><rect x="1080" y="466" width="312" height="120" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="1104" y="500" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Sugestão do modelo</text><text x="1104" y="526" font-family="Inter" font-size="13.5" font-weight="400" fill="#5B6472">58% · confiabilidade baixa</text><g id="link_ver_sugestao"><text x="1104" y="556" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3">Ver a sugestão explicada  →</text></g></g><rect x="0" y="0" width="1440" height="900" fill="#0B1220" fill-opacity="0.38"/><g id="dialogo_registrar_episodio"><rect x="420" y="120" width="600" height="530" rx="14" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="452" y="168" font-family="Inter" font-size="21" font-weight="700" fill="#111827">Registrar episódio relatado</text><text x="452" y="192" font-family="Inter" font-size="13" font-weight="400" fill="#5B6472">Roberto Mendes · entra na linha do tempo das evidências</text><rect x="452" y="226" width="536" height="46" rx="10" fill="#FEF3F2" stroke="#FECDCA" stroke-width="1"/><circle cx="474" cy="250" r="9" fill="#C81E1E"/><path d="M470.58,246.58 L477.42,253.42 M477.42,246.58 L470.58,253.42" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="494" y="255" font-family="Inter" font-size="14" font-weight="600" fill="#C81E1E">Preencha os campos indicados para adicionar</text><g id="campo_data"><text x="452" y="290" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Data aproximada</text><rect x="452" y="298" width="260" height="40" rx="8" fill="#FFFFFF" stroke="#C81E1E" stroke-width="1.5"/><text x="464" y="323" font-family="Inter" font-size="14" font-weight="400" fill="#6B7280">dd/mm/aaaa</text><circle cx="459" cy="353" r="7" fill="#C81E1E"/><path d="M456.34,350.34 L461.66,355.66 M461.66,350.34 L456.34,355.66" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="472" y="358" font-family="Inter" font-size="12.5" font-weight="500" fill="#C81E1E">Informe a data, mesmo aproximada.</text></g><text x="728" y="290" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Relatado por</text><rect x="728" y="298" width="260" height="40" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="740" y="323" font-family="Inter" font-size="14" font-weight="400" fill="#6B7280">Quem relatou?</text><g id="opcoes_atividade"><text x="452" y="386" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Atividade afetada</text><circle cx="461" cy="413" r="9" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1.6"/><text x="478" y="418" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Deslocamento</text><circle cx="591" cy="413" r="9" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1.6"/><text x="608" y="418" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Finanças</text><circle cx="721" cy="413" r="9" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1.6"/><text x="738" y="418" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Direção</text><circle cx="851" cy="413" r="9" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1.6"/><text x="868" y="418" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Outra</text><text x="452" y="444" font-family="Inter" font-size="12.5" font-weight="500" fill="#C81E1E">Escolha a atividade afetada.</text></g><g 