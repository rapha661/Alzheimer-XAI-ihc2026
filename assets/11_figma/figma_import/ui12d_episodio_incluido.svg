a filha</text><text x="320" y="607" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">02/11/2026</text><circle cx="416" cy="603" r="7" fill="#C2410C"/><text x="438" y="607" font-family="Inter" font-size="12.5" font-weight="700" fill="#C2410C">Episódio relatado · finanças</text><text x="438" y="631" font-family="Inter" font-size="14.5" font-weight="500" fill="#111827">Lapsos ao pagar as contas da casa.</text><text x="438" y="651" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Relatado pela filha</text><rect x="972" y="593" width="49" height="22" rx="11" fill="#FFFAEB"/><text x="982" y="608" font-family="Inter" font-size="12" font-weight="600" fill="#B45309">novo</text><text x="320" y="683" font-family="Inter" font-size="13" font-weight="600" fill="#5B6472">13/11/2026</text><circle cx="416" cy="679" r="7" fill="#64748B"/><text x="438" y="683" font-family="Inter" font-size="12.5" font-weight="700" fill="#64748B">Teste cognitivo</text><text x="438" y="707" font-family="Inter" font-size="14.5" font-weight="500" fill="#111827">MMSE 27 / 30 (hoje)</text><text x="438" y="727" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Contexto clínico</text><rect x="320" y="745" width="712" height="44" rx="8" fill="#FFFAEB"/><path d="M340,758 L350,775 L330,775 Z" fill="#B45309" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M340,764 L340,769" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="772" r="1.2" fill="#fff"/><text x="358" y="772" font-family="Inter" font-size="13.5" font-weight="500" fill="#111827">Os episódios relatados são posteriores ao teste de junho; o MMSE de hoje continua 27.</text></g><g id="contexto_clinico"><rect x="1080" y="209" width="312" height="241" rx="12" fill="#F8FAFC" stroke="#C9D2DF" stroke-width="1" stroke-dasharray="5 4"/><text x="1104" y="243" font-family="Inter" font-size="16" font-weight=