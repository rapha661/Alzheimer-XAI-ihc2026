<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>UI15 — Consultar a referência objetiva</title><rect x="0" y="0" width="1440" height="900" fill="#F6F7F9"/><g id="barra_lateral"><rect x="0" y="0" width="248" height="900" fill="#FBFBFC"/><line x1="248" y1="0" x2="248" y2="900" stroke="#E3E6EC" stroke-width="1"/><rect x="24" y="22" width="34" height="34" rx="8" fill="#3346D3"/><text x="41" y="45" font-family="Inter" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">M</text><text x="68" y="37" font-family="Inter" font-size="15" font-weight="700" fill="#111827">M-XAI</text><text x="68" y="53" font-family="Inter" font-size="11.5" font-weight="400" fill="#5B6472">Apoio à investigação cognitiva</text><g id="menu_fila"><rect x="16" y="96" width="216" height="38" rx="8" fill="#EDEFF3"/><rect x="16" y="104" width="3" height="22" rx="1.5" fill="#3346D3"/><rect x="34" y="108" width="16" height="14" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/><text x="64" y="120" font-family="Inter" font-size="14" font-weight="600" fill="#111827">Fila de laudos</text></g><line x1="16" y1="804" x2="232" y2="804" stroke="#E3E6EC" stroke-width="1"/><g id="usuario_logado"><circle cx="42" cy="842" r="18" fill="#EEF0FD"/><text x="42" y="847" font-family="Inter" font-size="12.5" font-weight="700" fill="#3346D3" text-anchor="middle">HP</text><text x="70" y="837" font-family="Inter" font-size="13.5" font-weight="600" fill="#111827">Helena Siqueira Prado</text><text x="70" y="855" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">Radiologista</text></g><g id="link_sair"><text x="70" y="880" font-family="Inter" font-size="12.5" font-weight="600" fill="#3346D3">Sair</text></g></g><g id="link_voltar_fila"><path d="M306,40 L296,40 M301,35 L296,40 L301,45" fill="none" stroke="#5B6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="314" y="44" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Fila de laudos</text></g><text x="296" y="92" font-family="Inter" font-size="28" font-weight="700" fill="#111827">José Ferraz</text><rect x="470.7" y="72" width="73.3" height="22" rx="11" fill="#EEF0FD"/><text x="480.7" y="87" font-family="Inter" font-size="12" font-weight="600" fill="#3346D3">Em laudo</text><text x="296" y="122" font-family="Inter" font-size="14" font-weight="400" fill="#5B6472">RM de crânio  ·  72 anos  ·  Hospital Santa Clara  ·  prazo hoje às 18h</text><g id="painel_imagem"><rect x="296" y="152" width="520" height="588" rx="12" fill="#0B0F1A"/><text x="316" y="182" font-family="Inter" font-size="11.5" font-weight="600" fill="#AEB6C6">CORTE AXIAL · NÍVEL DOS HIPOCAMPOS</text><text x="796" y="182" font-family="Inter" font-size="11.5" font-weight="500" fill="#AEB6C6" text-anchor="end">RM de 18/11/2026</text><g id="ressonancia_ilustracao"><rect x="316" y="196" width="480" height="480" fill="#05070D"/><ellipse cx="556" cy="436" rx="163.6" ry="201.8" fill="#3B404B" stroke="#C9CED8" stroke-width="9.8"/><ellipse cx="556" cy="436" rx="144" ry="181.1" fill="#7D838F"/><ellipse cx="556" cy="436" rx="106.9" ry="139.6" fill="#A3A8B2"/><path d="M549.5,379.3 C512.4,381.5 508,446.9 542.9,468.7 Z" fill="#1C2029"/><path d="M562.5,379.3 C599.6,381.5 604,446.9 569.1,468.7 Z" fill="#1C2029"/><line x1="556" y1="261.5" x2="556" y2="610.5" stroke="#5E6470" stroke-width="2.1818181818181817"/><defs><radialGradient id="h1"><stop offset="0" stop-color="#F23B2E" stop-opacity="0.9"/><stop offset="0.5" stop-color="#F2D33A" stop-opacity="0.55"/><stop offset="1" stop-color="#22C1C3" stop-opacity="0"/></radialGradient></defs><circle cx="488.4" cy="505.8" r="52.4" fill="url(#h1)"/><circle cx="625.8" cy="508" r="43.6" fill="url(#h1)"/></g><rect x="296" y="684" width="520" height="56" fill="#121829"/><text x="316" y="708" font-family="Inter" font-size="12.5" font-weight="500" fill="#E5E7EB">Mapa de atenção (Grad-CAM): onde o modelo se apoiou, não uma lesão.</text><defs><linearGradient id="lg2" x1="0" x2="1"><stop offset="0" stop-color="#22C1C3"/><stop offset=".5" stop-color="#F2D33A"/><stop offset="1" stop-color="#F23B2E"/></linearGradient></defs><text x="316" y="728" font-family="Inter" font-size="11" font-weight="400" fill="#AEB6C6">menor</text><rect x="358" y="720" width="70" height="8" rx="4" fill="url(#lg2)"/><text x="436" y="728" font-family="Inter" font-size="11" font-weight="400" fill="#AEB6C6">maior</text><text x="796" y="728" font-family="Inter" font-size="11" font-weight="400" fill="#8A93A1" text-anchor="end">Ilustração esquemática do exame</text></g><g id="card_referencia_objetiva"><rect x="840" y="152" width="552" height="240" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="864" y="188" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Análise do modelo · segunda leitura</text><text x="864" y="222" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Volume hipocampal</text><text x="864" y="254" font-family="Inter" font-size="26" font-weight="700" fill="#111827">5.900 mm³</text><text x="1021.1" y="254" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">0,39% do volume intracraniano</text><text x="864" y="282" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Valor informado no envio. Quando falta, aparece como &quot;imputado&quot; (estimado pelo</text><text x="864" y="299" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">modelo).</text><line x1="864" y1="310" x2="1368" y2="310" stroke="#E3E6EC" stroke-width="1"/><text x="864" y="338" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">É uma referência para a sua leitura, não uma conclusão. O modelo não nomeia</text><text x="864" y="358" font-family="Inter" font-size="13.5" font-weight="400" fill="#111827">regiões e não calcula percentil para a idade.</text></g><g id="card_limites_da_sugestao"><rect x="840" y="408" width="552" height="130" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><path d="M872,429 L882,446 L862,446 Z" fill="#5B6472" stroke="#5B6472" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M872,435 L872,440" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="872" cy="443" r="1.2" fill="#fff"/><text x="890" y="443" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Limites da sugestão</text><text x="864" y="472" font-family="Inter" font-size="13" font-weight="400" fill="#111827">Treinado na base ADNI; não validado na população brasileira.</text><text x="864" y="494" font-family="Inter" font-size="13" font-weight="400" fill="#111827">Distingue só normal e Alzheimer; não avalia comprometimento cognitivo leve.</text><text x="864" y="524" font-family="Inter" font-size="11.5" font-weight="400" fill="#6B7280">Fusão tardia: ResNet50 (imagem) + Random Forest (dados)</text></g><g id="card_pergunta_clinica"><rect x="840" y="554" width="552" height="118" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><rect x="840" y="554" width="552" height="4" fill="#3346D3"/><text x="864" y="590" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Pergunta clínica</text><text x="1368" y="590" font-family="Inter" font-size="12" font-weight="400" fill="#5B6472" text-anchor="end">Dr. Paulo Viana · Hospital Santa Clara</text><text x="864" y="624" font-family="Inter" font-size="15" font-weight="500" fill="#111827">Queixa de memória há cerca de um ano; distinguir declínio esperado</text><text x="864" y="646" font-family="Inter" font-size="15" font-weight="500" fill="#111827">para a idade de doença de Alzheimer.</text></g><g id="btn_redigir_laudo"><rect x="1232" y="688" width="160" height="44" rx="8" fill="#3346D3"/><text x="1312" y="715" font-family="Inter" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Redigir o laudo</text></g><g id="link_voltar_exame"><text x="840" y="715" font-family="Inter" font-size="14" font-weight="600" fill="#3346D3">←  Voltar à pergunta clínica</text></g></svg>