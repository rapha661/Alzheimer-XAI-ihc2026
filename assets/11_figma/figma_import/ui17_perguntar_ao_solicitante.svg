<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>UI17 — Perguntar ao solicitante</title><rect x="0" y="0" width="1440" height="900" fill="#F6F7F9"/><g id="barra_lateral"><rect x="0" y="0" width="248" height="900" fill="#FBFBFC"/><line x1="248" y1="0" x2="248" y2="900" stroke="#E3E6EC" stroke-width="1"/><rect x="24" y="22" width="34" height="34" rx="8" fill="#3346D3"/><text x="41" y="45" font-family="Inter" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">M</text><text x="68" y="37" font-family="Inter" font-size="15" font-weight="700" fill="#111827">M-XAI</text><text x="68" y="53" font-family="Inter" font-size="11.5" font-weight="400" fill="#5B6472">Apoio à investigação cognitiva</text><g id="menu_fila"><rect x="16" y="96" width="216" height="38" rx="8" fill="#EDEFF3"/><rect x="16" y="104" width="3" height="22" rx="1.5" fill="#3346D3"/><rect x="34" y="108" width="16" height="14" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/><text x="64" y="120" font-family="Inter" font-size="14" font-weight="600" fill="#111827">Fila de laudos</text></g><line x1="16" y1="804" x2="232" y2="804" stroke="#E3E6EC" stroke-width="1"/><g id="usuario_logado"><circle cx="42" cy="842" r="18" fill="#EEF0FD"/><text x="42" y="847" font-family="Inter" font-size="12.5" font-weight="700" fill="#3346D3" text-anchor="middle">HP</text><text x="70" y="837" font-family="Inter" font-size="13.5" font-weight="600" fill="#111827">Helena Siqueira Prado</text><text x="70" y="855" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">Radiologista</text></g><g id="link_sair"><text x="70" y="880" font-family="Inter" font-size="12.5" font-weight="600" fill="#3346D3">Sair</text></g></g><g id="link_voltar_fila"><path d="M306,40 L296,40 M301,35 L296,40 L301,45" fill="none" stroke="#5B6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="314" y="44" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">Fila de laudos</text></g><text x="296" y="92" font-family="Inter" font-size="28" font-weight="700" fill="#111827">José Ferraz</text><rect x="470.7" y="72" width="73.3" height="22" rx="11" fill="#EEF0FD"/><text x="480.7" y="87" font-family="Inter" font-size="12" font-weight="600" fill="#3346D3">Em laudo</text><text x="296" y="122" font-family="Inter" font-size="14" font-weight="400" fill="#5B6472">RM de crânio  ·  72 anos  ·  Hospital Santa Clara  ·  prazo hoje às 18h</text><g id="card_pergunta_clinica"><rect x="296" y="152" width="420" height="140" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><rect x="296" y="152" width="420" height="4" fill="#3346D3"/><text x="320" y="188" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Pergunta clínica</text><text x="692" y="188" font-family="Inter" font-size="12" font-weight="400" fill="#5B6472" text-anchor="end">Dr. Paulo Viana · Hospital Santa Clara</text><text x="320" y="222" font-family="Inter" font-size="15" font-weight="500" fill="#111827">Queixa de memória há cerca de um ano; distinguir</text><text x="320" y="244" font-family="Inter" font-size="15" font-weight="500" fill="#111827">declínio esperado para a idade de doença de</text><text x="320" y="266" font-family="Inter" font-size="15" font-weight="500" fill="#111827">Alzheimer.</text></g><g id="card_referencia_objetiva"><rect x="296" y="308" width="420" height="166" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="320" y="344" font-family="Inter" font-size="15" font-weight="600" fill="#111827">Análise do modelo · segunda leitura</text><text x="320" y="378" font-family="Inter" font-size="12.5" font-weight="500" fill="#5B6472">Volume hipocampal</text><text x="320" y="410" font-family="Inter" font-size="26" font-weight="700" fill="#111827">5.900 mm³</text><text x="477.1" y="410" font-family="Inter" font-size="14" font-weight="500" fill="#5B6472">0,39% do volume intracraniano</text><text x="320" y="438" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Valor informado no envio. Quando falta, aparece como</text><text x="320" y="455" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">&quot;imputado&quot; (estimado pelo modelo).</text></g><g id="formulario_laudo"><rect x="740" y="152" width="652" height="564" rx="12" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="764" y="188" font-family="Inter" font-size="17" font-weight="700" fill="#111827">Laudo</text><text x="1368" y="188" font-family="Inter" font-size="12" font-weight="500" fill="#5B6472" text-anchor="end">Método e dúvida acompanham o laudo para o solicitante</text><text x="764" y="216" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Achado</text><rect x="764" y="224" width="604" height="64" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="776" y="248" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Hipocampos com redução volumétrica discreta, simétrica, sem outras alterações</text><text x="776" y="268" font-family="Inter" font-size="14" font-weight="400" fill="#111827">relevantes para a faixa etária.</text><g id="metodo_de_avaliacao"><text x="764" y="320" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Método de avaliação</text><rect x="764" y="337" width="18" height="18" rx="4" fill="#3346D3" stroke="#3346D3" stroke-width="1.5"/><path d="M768,346 L772,350 L778,342" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="792" y="352" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Inspeção visual dos cortes</text><rect x="764" y="367" width="18" height="18" rx="4" fill="#3346D3" stroke="#3346D3" stroke-width="1.5"/><path d="M768,376 L772,380 L778,372" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="792" y="382" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Volume hipocampal informado (segunda leitura do modelo)</text><rect x="764" y="397" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1.5"/><text x="792" y="412" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Comparação com exame anterior — não disponível</text></g><g id="campo_duvida"><text x="764" y="444" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Dúvida que permanece</text><rect x="764" y="452" width="604" height="64" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="776" y="476" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Redução discreta para a idade, sem exame anterior para avaliar progressão.</text></g><g id="campo_conclusao"><text x="764" y="548" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Conclusão</text><rect x="764" y="556" width="604" height="64" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="776" y="580" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Redução volumétrica hipocampal discreta. Achado limítrofe para a idade; ver dúvida</text><text x="776" y="600" font-family="Inter" font-size="14" font-weight="400" fill="#111827">registrada.</text></g><g id="btn_liberar_laudo"><rect x="1208" y="648" width="160" height="44" rx="8" fill="#3346D3"/><text x="1288" y="675" font-family="Inter" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Liberar o laudo</text></g><g id="btn_perguntar_solicitante"><rect x="764" y="648" width="197" height="44" rx="8" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1"/><text x="862.5" y="675" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Perguntar ao solicitante</text></g></g><rect x="0" y="0" width="1440" height="900" fill="#0B1220" fill-opacity="0.45"/><g id="dialogo_perguntar_solicitante"><rect x="420" y="220" width="600" height="330" rx="14" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/><text x="452" y="270" font-family="Inter" font-size="20" font-weight="700" fill="#111827">Perguntar ao solicitante</text><text x="452" y="296" font-family="Inter" font-size="13.5" font-weight="400" fill="#5B6472">Para: Dr. Paulo Viana · Hospital Santa Clara</text><g id="campo_pergunta"><text x="452" y="330" font-family="Inter" font-size="13" font-weight="500" fill="#111827">Pergunta</text><rect x="452" y="338" width="536" height="84" rx="8" fill="#FFFFFF" stroke="#8A93A1" stroke-width="1"/><text x="464" y="362" font-family="Inter" font-size="14" font-weight="400" fill="#111827">Há exame de imagem anterior ou avaliação neuropsicológica recente? A</text><text x="464" y="382" font-family="Inter" font-size="14" font-weight="400" fill="#111827">dúvida é se a redução hipocampal é progressiva.</text></g><text x="452" y="458" font-family="Inter" font-size="12.5" font-weight="400" fill="#5B6472">A pergunta vai ligada a este exame e a resposta aparece no caso. A fila não fica travada.</text><g id="btn_enviar_pergunta"><rect x="828" y="484" width="160" height="40" rx="8" fill="#3346D3"/><text x="908" y="509" font-family="Inter" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Enviar pergunta</text></g><g id="btn_cancelar_pergunta"><rect x="706" y="484" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1"/><text x="761" y="509" font-family="Inter" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Cancelar</text></g></g></svg>